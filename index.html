<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>感创 · 项目信息流转平台</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#fff; --text:#1a1a2e; --text2:#64748b; --text3:#94a3b8;
  --border:#e2e8f0; --primary:#4f46e5; --primary-light:#eef2ff;
  --success:#059669; --warning:#d97706; --danger:#dc2626; --info:#2563eb;
  --radius:12px; --radius-sm:8px; --safe-bottom:env(safe-area-inset-bottom,0);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
input,textarea,select,button{font-family:inherit;font-size:16px;outline:none}
button{cursor:pointer;border:none;background:none;color:inherit}

/* === Top Bar === */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow);
}
.topbar .logo{font-size:18px;font-weight:700;white-space:nowrap;color:var(--primary)}
.topbar .logo span{font-weight:400;font-size:13px;color:var(--text2);margin-left:4px}
.topbar .spacer{flex:1}
.topbar .dept-select{
  padding:6px 12px;border-radius:20px;font-size:14px;font-weight:600;
  background:var(--primary-light);color:var(--primary);border:1.5px solid var(--primary);
  min-width:80px;text-align:center;appearance:none;-webkit-appearance:none;
}
.topbar .stat-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text2);
  background:var(--bg);padding:4px 10px;border-radius:20px;white-space:nowrap;
}
.topbar .stat-badge b{color:var(--text)}
.topbar .btn-icon{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .2s;
}
.topbar .btn-icon:hover{background:var(--bg)}

/* === Search === */
.search-bar{
  margin:12px 16px 0;position:relative;
}
.search-bar input{
  width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--border);
  border-radius:24px;font-size:15px;background:var(--surface);
  transition:border .2s;
}
.search-bar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.search-bar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3)}
.search-bar .clear-search{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;background:var(--border);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  color:var(--text2);display:none;
}

/* === Pipeline Bar === */
.pipeline-bar{
  display:flex;gap:0;padding:14px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.pipeline-bar::-webkit-scrollbar{display:none}
.pipeline-step{
  flex:1 0 80px;min-width:80px;text-align:center;padding:10px 4px;
  border-radius:var(--radius-sm);background:var(--surface);transition:all .2s;
  border:1.5px solid var(--border);position:relative;cursor:pointer;
}
.pipeline-step.active{border-color:var(--primary);background:var(--primary-light)}
.pipeline-step:hover{border-color:var(--primary)}
.pipeline-step .step-num{
  width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;margin-bottom:3px;
  background:var(--bg);color:var(--text3);
}
.pipeline-step.active .step-num{background:var(--primary);color:#fff}
.pipeline-step .step-name{font-size:11px;font-weight:600;color:var(--text2);line-height:1.3}
.pipeline-step.active .step-name{color:var(--primary)}
.pipeline-step .step-count{font-size:18px;font-weight:700;margin-top:1px}
.pipeline-step.active .step-count{color:var(--primary)}
.pipeline-step .step-sub{font-size:10px;color:var(--text3)}
.pipeline-step::after{
  content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);
  width:7px;height:7px;border-top:1.5px solid var(--border);
  border-right:1.5px solid var(--border);transform:translateY(-50%) rotate(45deg);
}
.pipeline-step:last-child::after{display:none}

/* === Section === */
.section{margin:0 16px 16px}
.section-title{
  font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.section-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.section-title .count{font-size:12px;color:var(--text3);font-weight:400}

/* === My Tasks === */
.my-task-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:6px;
  border:1px solid transparent;gap:8px;
}
.my-task-item .task-tag{
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;
}
.my-task-item .task-name{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* === Filter Tabs === */
.filter-tabs{
  display:flex;gap:4px;overflow-x:auto;padding:8px 16px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{
  padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
  white-space:nowrap;background:var(--surface);border:1.5px solid var(--border);
  color:var(--text2);transition:all .2s;
}
.filter-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* === Project Cards === */
.project-list{display:flex;flex-direction:column;gap:12px}
.project-card{
  background:var(--surface);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);border:1.5px solid var(--border);transition:all .2s;cursor:pointer;
}
.project-card:hover{box-shadow:var(--shadow-md)}
.project-card:active{transform:scale(.99)}
.project-card.needs-me{border-color:var(--warning);box-shadow:0 0 0 2px rgba(217,119,6,.15)}
.project-header{
  display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px;
}
.project-title{font-size:15px;font-weight:700;line-height:1.3}
.project-meta{font-size:12px;color:var(--text3);margin-top:2px}

/* Stage badge */
.stage-badge{
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;
}
.sb-pending{background:#f1f5f9;color:#64748b}
.sb-progress{background:#dbeafe;color:#2563eb}
.sb-done{background:#dcfce7;color:#059669}
.sb-delayed{background:#fef2f2;color:#dc2626}

/* Stage pipeline */
.stage-pipeline{
  display:flex;gap:3px;align-items:center;margin:8px 0;
}
.stage-pipeline .sp-dot{flex:1;height:6px;border-radius:3px;background:var(--border)}
.sp-dot.done{background:var(--success)}
.sp-dot.in-progress{background:var(--primary);height:8px;border-radius:4px}
.sp-dot.delayed{background:var(--danger)}
.sp-dot.my-dept{background:var(--warning);animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* Stage labels row */
.stage-labels{
  display:flex;justify-content:space-between;margin:4px 0 8px;
}
.stage-labels span{font-size:10px;color:var(--text3)}
.stage-labels span.active{color:var(--primary);font-weight:700}
.stage-labels span.done{color:var(--success)}

/* Card footer */
.project-footer{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;
  font-size:12px;color:var(--text2);padding-top:10px;border-top:1px solid var(--border);
}
.project-footer .pf-info{display:flex;align-items:center;gap:4px}

/* === Buttons === */
.btn-sm{
  padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
  transition:all .2s;display:inline-flex;align-items:center;gap:4px;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-outline{background:var(--surface);color:var(--primary);border:1.5px solid var(--primary)}
.btn-outline:hover{background:var(--primary-light)}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-gray{background:var(--bg);color:var(--text);border:1.5px solid var(--border)}

/* === Action Bar === */
.action-bar{
  display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;
  position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:calc(12px + var(--safe-bottom));z-index:50;
}
.action-bar button{
  flex:1;min-width:80px;padding:10px;border-radius:22px;
  font-size:14px;font-weight:600;text-align:center;transition:all .2s;
}

/* === Modals === */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
}
@media(min-width:768px){.modal-overlay{align-items:center}}
.modal{
  background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:680px;
  max-height:90vh;overflow-y:auto;padding:24px 20px;
  box-shadow:0 -4px 24px rgba(0,0,0,.12);
}
@media(min-width:768px){.modal{border-radius:16px;margin:20px}}
.modal h2{font-size:20px;margin-bottom:14px;padding-right:28px}
.modal h3{font-size:15px;margin-bottom:10px}

/* Stage detail */
.stage-detail{
  padding:12px 14px;border-radius:var(--radius-sm);margin-bottom:8px;
  border:1.5px solid var(--border);
}
.stage-detail.current{background:var(--primary-light);border-color:var(--primary)}
.stage-detail.completed{background:#f0fdf4;border-color:#86efac}
.stage-detail .sd-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;
}
.stage-detail .sd-label{font-weight:700;font-size:14px}
.stage-detail .sd-status{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;
}
.stage-detail .sd-info{font-size:13px;color:var(--text2);line-height:1.6}
.stage-detail .sd-edit{margin-top:6px}
.stage-detail .sd-edit input,.stage-detail .sd-edit textarea{
  width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;margin-top:4px;
}
.stage-detail .sd-edit textarea{min-height:40px;resize:vertical}
.stage-detail .sd-actions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}

/* Form */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;
  font-size:15px;transition:border .2s;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);
}
.form-group textarea{min-height:56px;resize:vertical}

/* Empty */
.empty-state{
  text-align:center;padding:40px 20px;color:var(--text3);
}
.empty-state svg{margin-bottom:10px;opacity:.4}

/* Toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;
  padding:10px 22px;border-radius:20px;font-size:14px;font-weight:600;
  color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .3s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--info)}

/* Confirm */
.confirm-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.confirm-box{
  background:var(--surface);border-radius:var(--radius);padding:24px;
  max-width:360px;width:100%;text-align:center;
}
.confirm-box h3{margin-bottom:8px}
.confirm-box p{color:var(--text2);font-size:14px;margin-bottom:18px}
.confirm-box .btn-row{display:flex;gap:8px}
.confirm-box .btn-row button{flex:1;padding:10px;border-radius:20px;font-weight:600;font-size:14px}

/* === Desktop === */
@media(min-width:768px){
  .topbar{padding:10px 24px}
  .search-bar{margin:12px 24px 0}
  .pipeline-bar{padding:14px 24px}
  .pipeline-step{min-width:auto;flex:1}
  .section{margin:0 24px 20px}
  .filter-tabs{padding:8px 24px}
  .action-bar{padding:12px 24px;padding-bottom:12px}
  .project-list{display:grid;grid-template-columns:repeat(2,1fr)}
}
@media(min-width:1024px){
  .project-list{grid-template-columns:repeat(3,1fr)}
}

/* === Analytics === */
.analytics-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;
}
@media(min-width:768px){.analytics-grid{grid-template-columns:repeat(4,1fr)}}
.analytics-card{
  background:var(--bg);border-radius:var(--radius-sm);padding:14px;text-align:center;
  border:1.5px solid var(--border);
}
.analytics-card .ac-value{font-size:28px;font-weight:800;line-height:1.2}
.analytics-card .ac-label{font-size:12px;color:var(--text2);margin-top:2px}
.analytics-card .ac-sub{font-size:10px;color:var(--text3);margin-top:2px}

.analytics-section{
  margin-bottom:16px;
}
.analytics-section h3{
  font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text);
  display:flex;align-items:center;gap:6px;
}
.analytics-section h3::before{
  content:'';width:4px;height:16px;border-radius:2px;display:inline-block;
  background:var(--primary);
}
.chart-container{
  background:var(--surface);border-radius:var(--radius-sm);padding:16px;
  border:1.5px solid var(--border);overflow-x:auto;
}
.chart-row{display:flex;gap:12px;flex-wrap:wrap}
.chart-row>*{flex:1;min-width:260px}

/* Bar chart */
.bar-row{display:flex;align-items:center;margin-bottom:8px;gap:8px}
.bar-row .bar-label{width:70px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0;color:var(--text2)}
.bar-row .bar-track{flex:1;height:22px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
.bar-row .bar-fill{height:100%;border-radius:4px;transition:width .5s ease;display:flex;align-items:center;padding-left:8px}
.bar-row .bar-fill span{font-size:11px;font-weight:700;color:#fff;white-space:nowrap}

/* Donut */
.donut-wrap{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}

/* Legend */
.legend{display:flex;flex-direction:column;gap:4px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
</style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="topbar">
  <div class="logo">感创<span>| 项目流转</span></div>
  <div class="spacer"></div>
  <span class="stat-badge">共 <b id="totalProjects">0</b> 个项目</span>
  <select class="dept-select" id="deptSelect" onchange="APP.switchDept(this.value)">
    <option value="all">全部视角</option>
    <option value="项目部">项目部</option>
    <option value="采购部">采购部</option>
    <option value="研发部">研发部</option>
    <option value="生产部">生产部</option>
    <option value="发货">发货</option>
    <option value="维护部">维护部</option>
    <option value="财务部">财务部</option>
  </select>
  <span id="modeBadge" style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap"></span>
  <button class="btn-icon" onclick="APP.openAnalytics()" title="数据分析" style="font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-light);border-radius:16px;padding:5px 12px;width:auto;gap:3px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>
    分析
  </button>
  <button class="btn-icon" onclick="APP.openBackup()" title="数据管理">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
  </button>
</div>

<!-- ===== Search ===== -->
<div class="search-bar">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  <input type="text" id="searchInput" placeholder="搜索项目名称、合同号、代理商…" oninput="APP.doSearch()">
  <button class="clear-search" id="clearSearch" onclick="APP.clearSearch()">×</button>
</div>

<!-- ===== Pipeline Overview ===== -->
<div class="pipeline-bar" id="pipelineBar"></div>

<!-- ===== My Tasks ===== -->
<div class="section" id="myTasksSection"></div>

<!-- ===== Filter Tabs ===== -->
<div class="filter-tabs" id="filterTabs">
  <button class="filter-tab active" onclick="APP.setFilter('all')">全部项目</button>
  <button class="filter-tab" onclick="APP.setFilter('my')">需要我处理</button>
  <button class="filter-tab" onclick="APP.setFilter('active')">进行中</button>
  <button class="filter-tab" onclick="APP.setFilter('delayed')">已超期</button>
  <button class="filter-tab" onclick="APP.setFilter('done')">已完成</button>
</div>

<!-- ===== Project List ===== -->
<div class="section">
  <div class="section-title">
    <span class="dot" style="background:var(--primary)"></span>
    <span id="listTitle">全部项目</span>
    <span class="count" id="listCount"></span>
  </div>
  <div class="project-list" id="projectList"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>
    <p id="emptyMsg">暂无项目数据</p>
    <button class="btn-sm btn-primary" style="margin-top:12px" onclick="APP.openAddModal()">+ 创建第一个项目</button>
  </div>
</div>

<!-- ===== Bottom Bar ===== -->
<div class="action-bar">
  <button class="btn-primary" onclick="APP.openAddModal()">+ 新建项目</button>
  <button class="btn-outline" onclick="APP.exportData()">导出备份</button>
  <button class="btn-outline" style="color:var(--success)" onclick="APP.exportExcel()">导出Excel</button>
  <button class="btn-outline" onclick="APP.openImport()">导入恢复</button>
  <button class="btn-gray" onclick="APP.openAnalytics()">数据分析</button>
  <button class="btn-gray" onclick="APP.confirmClear()" style="color:var(--danger)">清空数据</button>
</div>

<!-- ===== Detail Modal ===== -->
<div class="modal-overlay" id="detailModal" style="display:none" onclick="if(event.target===this)APP.closeDetailModal()">
  <div class="modal" id="detailContent"></div>
</div>

<!-- ===== Add/Edit Modal ===== -->
<div class="modal-overlay" id="formModal" style="display:none" onclick="if(event.target===this)APP.closeFormModal()">
  <div class="modal" id="formContent"></div>
</div>

<!-- ===== Import Modal ===== -->
<div class="modal-overlay" id="importModal" style="display:none" onclick="if(event.target===this)APP.closeImportModal()">
  <div class="modal" id="importContent"></div>
</div>

<!-- ===== Backup Modal ===== -->
<div class="modal-overlay" id="backupModal" style="display:none" onclick="if(event.target===this)APP.closeBackup()">
  <div class="modal" id="backupContent"></div>
</div>

<!-- ===== Analytics Modal ===== -->
<div class="modal-overlay" id="analyticsModal" style="display:none" onclick="if(event.target===this)APP.closeAnalytics()">
  <div class="modal" id="analyticsContent"></div>
</div>

<!-- ===== Confirm Dialog ===== -->
<div class="confirm-overlay" id="confirmDialog" style="display:none">
  <div class="confirm-box">
    <h3 id="confirmTitle">确认操作</h3>
    <p id="confirmMsg"></p>
    <div class="btn-row">
      <button class="btn-gray" onclick="APP.cancelConfirm()">取消</button>
      <button id="confirmBtn" class="btn-danger" onclick="APP.runConfirm()">确认</button>
    </div>
  </div>
</div>

<script>
// ===== 部署配置（部署到 Vercel 时填写 Railway 后端地址）=====
// 例: var GC_API_BASE = 'https://gcgzt-production-xxxx.up.railway.app';
var GC_API_BASE = '';

// ===== API MODE: auto-detect =====
var API_BASE = (function(){
  // 手动配置了远程 API 地址（Vercel 部署场景）
  if(GC_API_BASE) return GC_API_BASE.replace(/\/+$/,'')+'/api';
  // 同源部署（Railway 一体部署场景）
  if(window.location.protocol==='http:'||window.location.protocol==='https:') return '/api';
  // 本地文件打开 — 使用 localStorage
  return '';
})();

// ===== STAGES =====

  {key:'order',    name:'执行单',   dept:'项目部', desc:'合同号、项目名称、代理商、项目清单'},
  {key:'purchase', name:'采购',     dept:'采购部', desc:'采购时间、到货情况'},
  {key:'dev',      name:'研发',     dept:'研发部', desc:'定制开发内容与进度'},
  {key:'production',name:'生产',    dept:'生产部', desc:'设备生产与安装情况'},
  {key:'shipping', name:'发货',     dept:'发货',   desc:'发货日期与物流信息'},
  {key:'maintenance',name:'维护开通',dept:'维护部', desc:'开通日期与备注'},
  {key:'payment',  name:'回款',     dept:'财务部', desc:'回款日期、金额、状态'}
];

// ===== HELPERS =====
function today(){return new Date().toISOString().split('T')[0]}
function daysAgo(d){if(!d)return 0;return Math.floor((new Date()-new Date(d+'T00:00:00'))/86400000)}
function isOverdue(st){return st&&st.s==='in-progress'&&st.de&&st.de<today()}

// ===== APP =====
var APP = {
  dept:'all',
  filter:'all',
  projects:[],
  confirmCb:null,
  searchText:'',

  init:function(){
    this.updateModeBadge();
    this.loadData();
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){APP.closeDetailModal();APP.closeFormModal();}});
  },

  updateModeBadge:function(){
    var badge=document.getElementById('modeBadge');
    if(GC_API_BASE){
      badge.textContent='远程API';
      badge.style.background='#dbeafe';badge.style.color='#2563eb';
    }else if(API_BASE){
      badge.textContent='在线(数据存本地)';
      badge.style.background='#dcfce7';badge.style.color='#059669';
    }else{
      badge.textContent='本地模式';
      badge.style.background='#fef3c7';badge.style.color='#d97706';
    }
  },

  // ==== DATA ====
  loadData:function(){
    var self=this;
    // 1. 始终先从 localStorage 加载（优先保障数据不丢）
    var local=localStorage.getItem('wb_gc_projects_v2');
    if(local){try{this.projects=JSON.parse(local)}catch(e){this.projects=[]}}
    this._migrateStages();
    // 2. 如果本地没有数据，直接用 DEMO
    if(!this.projects.length){this.projects=JSON.parse(JSON.stringify(DEMO));this.saveData()}
    // 3. API 模式下，尝试从服务器同步（服务端数据多/新则覆盖本地）
    if(API_BASE){
      fetch(API_BASE+'/projects')
        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
        .then(function(data){
          if(data.length>self.projects.length||(data.length===self.projects.length&&data.length>0&&!local)){
            // 服务器数据更多，或本地没有数据 → 用服务器的
            self.projects=data;
            self._migrateStages();
            localStorage.setItem('wb_gc_projects_v2',JSON.stringify(data));
          }else if(!data.length&&self.projects.length){
            // 服务器为空但本地有数据 → 把本地数据推上去
            self._syncToServer();
          }
          self.renderAll();
        })
        .catch(function(e){
          console.log('服务器同步跳过(使用本地数据):',e.message);
          self.renderAll();
        });
    }else{
      this.renderAll();
    }
  },

  _syncToServer:function(){
    if(API_BASE){
      fetch(API_BASE+'/projects',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.projects)})
        .catch(function(){});
    }
  },

  _migrateStages:function(){
    var migrated=false;
    for(var i=0;i<this.projects.length;i++){
      var p=this.projects[i];
      for(var j=0;j<STAGES.length;j++){
        var st=p.stages[STAGES[j].key];
        if(st&&st.hasOwnProperty('d')&&!st.hasOwnProperty('ds')){
          st.ds=st.s==='done'||st.s==='in-progress'||st.s==='delayed'?st.d:'';
          st.de=st.d||'';
          delete st.d;
          if(st.s==='delayed')st.s='in-progress';
          migrated=true;
        }
      }
    }
    if(migrated)this.saveData();
  },

  saveData:function(){
    // 始终写入 localStorage（第一优先级）
    localStorage.setItem('wb_gc_projects_v2',JSON.stringify(this.projects));
    // API 模式下同步到服务器（备份）
    if(API_BASE){
      fetch(API_BASE+'/projects',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.projects)})
        .catch(function(){});
    }
    // 备份提醒
    if(this.projects.length>=10&&!localStorage.getItem('wb_gc_backup_hint2')){
      localStorage.setItem('wb_gc_backup_hint2','1');
      this.toast('数据已积累'+this.projects.length+'条,建议导出备份','info');
    }
  },

  // ==== SEARCH ====
  doSearch:function(){
    this.searchText=document.getElementById('searchInput').value.trim().toLowerCase();
    var btn=document.getElementById('clearSearch');
    btn.style.display=this.searchText?'flex':'none';
    this.renderProjectList();
  },
  clearSearch:function(){
    document.getElementById('searchInput').value='';
    this.searchText='';
    document.getElementById('clearSearch').style.display='none';
    this.renderProjectList();
  },

  // ==== DEPT ====
  switchDept:function(d){
    this.dept=d;
    if(d==='all'&&this.filter==='my')this.filter='all';
    this.renderAll();
  },
  setFilter:function(f){
    this.filter=f;
    var tabs=document.querySelectorAll('.filter-tab');
    for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
    document.querySelectorAll('.filter-tab').forEach(function(t){
      if(t.textContent.trim()===APP.filterLabel(f))t.classList.add('active');
    });
    this.renderProjectList();
  },
  filterLabel:function(f){
    var m={all:'全部项目',my:'需要我处理',active:'进行中',delayed:'已超期',done:'已完成'};
    return m[f]||f;
  },

  // ==== GET STAGE FOR DEPT ====
  stageKeyFor:function(dept){
    for(var i=0;i<STAGES.length;i++){if(STAGES[i].dept===dept)return STAGES[i].key}
    return 'order';
  },

  // ==== RENDER ALL ====
  renderAll:function(){
    this.renderPipeline();
    this.renderMyTasks();
    this.renderProjectList();
    document.getElementById('totalProjects').textContent=this.projects.length;
  },

  // ---- Pipeline Bar ----
  renderPipeline:function(){
    var self=this,html='';
    for(var i=0;i<STAGES.length;i++){
      var s=STAGES[i];
      var inProg=0,overdue=0,pending=0;
      this.projects.forEach(function(p){
        var st=p.stages[s.key];
        if(st&&isOverdue(st))overdue++;
        else if(st&&st.s==='in-progress')inProg++;
        if(!st||st.s==='pending')pending++;
      });
      var isActive=(self.dept==='all'||self.dept===s.dept);
      var ovTxt=overdue?' <span style="color:var(--danger);font-size:10px">('+overdue+'超期)</span>':'';
      html+='<div class="pipeline-step'+(isActive?' active':'')+'" onclick="APP.switchDept(\''+s.dept+'\')">'+
        '<div class="step-num">'+(i+1)+'</div>'+
        '<div class="step-name">'+s.name+'</div>'+
        '<div class="step-count">'+(inProg+overdue)+'</div>'+
        '<div class="step-sub">进行中'+ovTxt+' | '+pending+'待处理</div>'+
      '</div>';
    }
    document.getElementById('pipelineBar').innerHTML=html;
  },

  // ---- My Tasks ----
  renderMyTasks:function(){
    var sec=document.getElementById('myTasksSection');
    if(this.dept==='all'){
      var inP=0,delayed=0,pending=0;
      this.projects.forEach(function(p){
        var hasInProg=false,hasDelayed=false;
        STAGES.forEach(function(s){
          var st=p.stages[s.key];
          if(st&&st.s==='in-progress')hasInProg=true;
          if(isOverdue(st))hasDelayed=true;
        });
        if(hasDelayed)delayed++;
        else if(hasInProg)inP++;
        else{
          var anyDone=false;
          for(var i=0;i<STAGES.length;i++){
            var st=p.stages[STAGES[i].key];
            if(st&&st.s==='done')anyDone=true;
            else if(anyDone||(st&&st.s==='pending')){pending++;break}
          }
          if(!anyDone)pending++;
        }
      });
      var done=this.projects.filter(function(p){
        return STAGES.every(function(s){var st=p.stages[s.key];return st&&st.s==='done'});
      }).length;
      sec.innerHTML='<div class="section-title"><span class="dot" style="background:var(--info)"></span>全局概览</div>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
        '<div style="flex:1;min-width:70px;background:var(--surface);border-radius:8px;padding:10px 8px;text-align:center;border:1px solid var(--border)"><div style="font-size:22px;font-weight:700;color:var(--primary)">'+inP+'</div><div style="font-size:11px;color:var(--text2)">进行中</div></div>'+
        '<div style="flex:1;min-width:70px;background:var(--surface);border-radius:8px;padding:10px 8px;text-align:center;border:1px solid var(--border)"><div style="font-size:22px;font-weight:700;color:var(--danger)">'+delayed+'</div><div style="font-size:11px;color:var(--text2)">已延期</div></div>'+
        '<div style="flex:1;min-width:70px;background:var(--surface);border-radius:8px;padding:10px 8px;text-align:center;border:1px solid var(--border)"><div style="font-size:22px;font-weight:700;color:var(--warning)">'+pending+'</div><div style="font-size:11px;color:var(--text2)">待启动</div></div>'+
        '<div style="flex:1;min-width:70px;background:var(--surface);border-radius:8px;padding:10px 8px;text-align:center;border:1px solid var(--border)"><div style="font-size:22px;font-weight:700;color:var(--success)">'+done+'</div><div style="font-size:11px;color:var(--text2)">已完成</div></div>'+
        '</div>';
      return;
    }

    var sk=this.stageKeyFor(this.dept);
    var stageName='';for(var i=0;i<STAGES.length;i++){if(STAGES[i].key===sk){stageName=STAGES[i].name;break}}
    var overdue=[],inProg=[],waiting=[];
    var self=this;
    this.projects.forEach(function(p){
      var st=p.stages[sk];if(!st)return;
      if(isOverdue(st))overdue.push(p);
      else if(st.s==='in-progress')inProg.push(p);
      else if(st.s==='pending')waiting.push(p);
    });

    var html='';
    if(overdue.length){
      for(var i=0;i<overdue.length;i++){
        var p=overdue[i];
        html+='<div class="my-task-item" style="background:#fef2f2;border-color:#fecaca">'+
          '<span class="task-tag" style="background:#dc2626;color:#fff">逾期</span>'+
          '<span class="task-name">'+p.name+'</span>'+
          '<button class="btn-sm btn-danger" onclick="event.stopPropagation();APP.openDetail(\''+p.id+'\')">处理</button></div>';
      }
    }
    if(inProg.length){
      for(var i=0;i<inProg.length;i++){
        var p=inProg[i];
        html+='<div class="my-task-item" style="background:#dbeafe;border-color:#bfdbfe">'+
          '<span class="task-tag" style="background:#2563eb;color:#fff">进行中</span>'+
          '<span class="task-name">'+p.name+'</span>'+
          '<button class="btn-sm btn-primary" onclick="event.stopPropagation();APP.openDetail(\''+p.id+'\')">处理</button></div>';
      }
    }
    if(waiting.length&&waiting.length<=6){
      for(var i=0;i<Math.min(waiting.length,6);i++){
        var p=waiting[i];
        html+='<div class="my-task-item" style="background:var(--bg);border-color:var(--border)">'+
          '<span class="task-tag" style="background:#e2e8f0;color:#64748b">待启动</span>'+
          '<span class="task-name">'+p.name+'</span>'+
          '<button class="btn-sm btn-outline" onclick="event.stopPropagation();APP.openDetail(\''+p.id+'\')">处理</button></div>';
      }
    }
    if(!html)html='<div style="color:var(--text3);font-size:13px;padding:14px;text-align:center;background:var(--surface);border-radius:8px;border:1px solid var(--border)">当前没有待处理的任务</div>';

    sec.innerHTML='<div class="section-title"><span class="dot" style="background:var(--warning)"></span>'+this.dept+' · '+stageName+'任务 ('+(overdue.length+inProg.length+waiting.length)+'项)</div>'+html;
  },

  // ---- Project List ----
  renderProjectList:function(){
    var list=this.projects.slice();
    var titleEl=document.getElementById('listTitle');
    var countEl=document.getElementById('listCount');

    // Search filter
    if(this.searchText){
      list=list.filter(function(p){
        var txt=(p.name+' '+p.contractNo+' '+p.agent+' '+p.items).toLowerCase();
        return txt.indexOf(APP.searchText)>=0;
      });
      titleEl.textContent='搜索结果';
    }
    // Dept filter
    else if(this.filter==='my'&&this.dept!=='all'){
      var sk=this.stageKeyFor(this.dept);
      list=list.filter(function(p){var st=p.stages[sk];return st&&(st.s==='in-progress'||st.s==='pending'||isOverdue(st))});
      titleEl.textContent='需要我处理';
    }else if(this.filter==='active'){
      list=list.filter(function(p){return STAGES.some(function(s){var st=p.stages[s.key];return st&&st.s==='in-progress'})});
      titleEl.textContent='进行中的项目';
    }else if(this.filter==='delayed'){
      list=list.filter(function(p){return STAGES.some(function(s){return isOverdue(p.stages[s.key])})});
      titleEl.textContent='已超期的项目';
    }else if(this.filter==='done'){
      list=list.filter(function(p){return STAGES.every(function(s){var st=p.stages[s.key];return st&&st.s==='done'})});
      titleEl.textContent='已完成的项目';
    }else{
      titleEl.textContent='全部项目';
    }
    countEl.textContent='('+list.length+')';

    var container=document.getElementById('projectList');
    var empty=document.getElementById('emptyState');

    if(!list.length){
      container.innerHTML='';
      empty.style.display='block';
      document.getElementById('emptyMsg').textContent=this.searchText?'没有找到匹配的项目':'暂无项目数据';
      return;
    }
    empty.style.display='none';

    var self=this;
    container.innerHTML=list.map(function(p){return self.cardHTML(p)}).join('');

    // Update filter tab
    var tabs=document.querySelectorAll('.filter-tab');
    for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
    tabs.forEach(function(t){if(t.textContent.trim()===self.filterLabel(self.filter))t.classList.add('active')});
  },

  // ---- Card ----
  cardHTML:function(p){
    // Find current stage — overdue is computed, not stored
    var curIdx=0,curStatus='pending';
    for(var i=0;i<STAGES.length;i++){
      var st=p.stages[STAGES[i].key];
      if(st&&st.s==='in-progress'){curIdx=i;curStatus='in-progress';break}
      if(st&&st.s==='done'){curIdx=i;curStatus='done'}
      else if(curStatus==='done'){curIdx=i;curStatus='pending'}
    }
    // After loop, check if current stage is overdue
    var curSt=p.stages[STAGES[curIdx].key];
    var stageOverdue=isOverdue(curSt);

    // Badge
    var badgeCls='sb-pending',badgeText='待启动';
    if(stageOverdue){badgeCls='sb-delayed';badgeText='第'+(curIdx+1)+'步 · 已超期'+daysAgo(curSt.de)+'天'}
    else if(curStatus==='in-progress'){badgeCls='sb-progress';badgeText='第'+(curIdx+1)+'步 · '+STAGES[curIdx].name+'中'}
    else if(curStatus==='done'){badgeCls='sb-done';badgeText='已完成'}
    else if(curIdx>0){badgeText='待'+STAGES[curIdx].dept+'处理'}

    // Stage dots
    var myKey=this.dept!=='all'?this.stageKeyFor(this.dept):'';
    var myIdx=-1;for(var i=0;i<STAGES.length;i++){if(STAGES[i].key===myKey){myIdx=i;break}}

    var dots='';
    for(var i=0;i<STAGES.length;i++){
      var st=p.stages[STAGES[i].key];
      var cls='sp-dot';
      if(st&&st.s==='done')cls+=' done';
      else if(isOverdue(st))cls+=' delayed';
      else if(i===curIdx&&curStatus==='in-progress'&&!stageOverdue)cls+=' in-progress';
      if(i===myIdx&&st&&st.s!=='done'&&st.s!=='in-progress')cls+=' my-dept';
      dots+='<div class="'+cls+'" title="'+STAGES[i].name+'"></div>';
    }

    // Stage labels
    var labels='';
    for(var i=0;i<STAGES.length;i++){
      var st=p.stages[STAGES[i].key];
      var done=st&&st.s==='done';
      var over=isOverdue(st);
      var cls=done?'done':(over?'active':'');
      var labelText=done?'✓ '+STAGES[i].name:(over?'⚠ '+STAGES[i].name:STAGES[i].name);
      labels+='<span class="'+cls+'"'+(over?' style="color:var(--danger);font-weight:700"':'')+'>'+labelText+'</span>';
    }

    // Action button
    var actionBtn='';
    if(this.dept!=='all'&&myIdx>=0&&curIdx===myIdx){
      if(stageOverdue){
        actionBtn='<button class="btn-sm btn-warning" onclick="event.stopPropagation();APP.completeMyStage(\''+p.id+'\')">标记完成</button>';
      }else if(curStatus==='in-progress'){
        actionBtn='<button class="btn-sm btn-success" onclick="event.stopPropagation();APP.completeMyStage(\''+p.id+'\')">标记完成</button>';
      }else if(curStatus==='pending'){
        actionBtn='<button class="btn-sm btn-primary" onclick="event.stopPropagation();APP.startMyStage(\''+p.id+'\')">开始处理</button>';
      }
    }else if(this.dept==='all'){
      actionBtn='<button class="btn-sm btn-outline" onclick="event.stopPropagation();APP.openDetail(\''+p.id+'\')">查看</button>';
    }

    // Need-me highlight
    var needsMe=(this.dept!=='all'&&myIdx>=0&&curIdx===myIdx)?' needs-me':'';

    return '<div class="project-card'+needsMe+'" onclick="APP.openDetail(\''+p.id+'\')">'+
      '<div class="project-header">'+
        '<div><div class="project-title">'+p.name+'</div><div class="project-meta">合同号：'+p.contractNo+' · '+p.agent+'</div></div>'+
        '<span class="stage-badge '+badgeCls+'">'+badgeText+'</span>'+
      '</div>'+

  // ==== DETAIL MODAL ====
  openDetail:function(pid){
    var p=this.findProject(pid);if(!p)return;

    var self=this;
    var html='<h2>'+p.name+'</h2>'+
      '<div style="color:var(--text2);font-size:13px;margin-bottom:16px;line-height:1.8">'+
        '<div>合同号：'+(p.contractNo||'未填')+'</div>'+
        '<div>代理商：'+(p.agent||'未填')+'</div>'+
        '<div>项目清单：'+(p.items||'未填')+'</div>'+
      '</div>';

    for(var i=0;i<STAGES.length;i++){
      var s=STAGES[i];
      var st=p.stages[s.key];
      var status=(st&&st.s)?st.s:'pending';

      var over=isOverdue(st);
      var label='待启动',color='#94a3b8',bg='#f1f5f9';
      if(status==='done'){label='已完成';color='#059669';bg='#dcfce7'}
      else if(over){label='已超期'+daysAgo(st.de)+'天';color='#dc2626';bg='#fecaca'}
      else if(status==='in-progress'){label='进行中';color='#4f46e5';bg='#dbeafe'}

      var isMine=(self.dept===s.dept&&self.dept!=='all');
      var actions='';
      if(isMine){
        if(status==='pending')actions='<button class="btn-sm btn-primary" onclick="APP.startStage(\''+pid+'\',\''+s.key+'\')">开始处理</button>';
        if(status==='in-progress'||over)actions='<button class="btn-sm btn-success" onclick="APP.completeStage(\''+pid+'\',\''+s.key+'\')">标记完成</button>';
        if(status!=='pending'){
          actions+=' <button class="btn-sm btn-gray" onclick="APP.toggleNoteEdit(\''+pid+'\',\''+s.key+'\')">编辑备注</button>';
        }
      }

      var dateRow='';
      if(st&&st.ds)dateRow+='<div>开始：'+st.ds+'</div>';
      if(st&&st.de)dateRow+='<div>'+(status==='done'?'完成：':'截止：')+st.de+(over?' <span style="color:#dc2626;font-weight:700">（已超期'+daysAgo(st.de)+'天）</span>':'')+'</div>';
      if(!dateRow&&status==='pending')dateRow='<div style="color:var(--text3)">等待 '+s.dept+' 处理</div>';
      if(!dateRow)dateRow='<div style="color:var(--text3)">-</div>';

      html+='<div class="stage-detail'+(isMine?' current':'')+(status==='done'?' completed':'')+(over?'" style="border-color:#fecaca;background:#fff5f5':'')+'" id="sd-'+pid+'-'+s.key+'">'+
        '<div class="sd-header">'+
          '<span class="sd-label">'+(i+1)+'. '+s.name+' <span style="font-size:11px;color:var(--text3);font-weight:400">('+s.dept+')</span></span>'+
          '<span class="sd-status" style="background:'+bg+';color:'+color+'">'+label+'</span>'+
        '</div>'+
        '<div class="sd-info" id="sdi-'+pid+'-'+s.key+'">'+dateRow+
          (st&&st.h?'<div>处理人：'+st.h+'</div>':'')+
          (st&&st.n?'<div>备注：'+st.n+'</div>':'')+
        '</div>'+
        (actions?'<div class="sd-actions">'+actions+'</div>':'')+
      '</div>';
    }

    html+='<div style="display:flex;gap:8px;margin-top:16px">'+
      '<button class="btn-sm btn-primary" style="flex:1" onclick="APP.openEditModal(\''+pid+'\')">编辑基本信息</button>'+
      '<button class="btn-sm btn-danger" style="flex:1" onclick="APP.deleteProject(\''+pid+'\')">删除项目</button>'+
    '</div>';

    document.getElementById('detailContent').innerHTML=html;
    document.getElementById('detailModal').style.display='flex';
  },

  doAdd:function(){

    var items=document.getElementById('f_items').value.trim();

    var id='P'+new Date().getFullYear()+'-'+String(this.projects.length+1).padStart(3,'0');

    for(var i=0;i<STAGES.length;i++){
      stages[STAGES[i].key]={s:'pending',ds:'',de:'',h:'',n:''};
    }
    // Auto-start first stage with today as start, 14-day default deadline
    var defDe=new Date();defDe.setDate(defDe.getDate()+14);
    stages.order.s='in-progress';stages.order.ds=today();stages.order.de=defDe.toISOString().split('T')[0];stages.order.h='项目部';

    this.projects.push({id:id,contractNo:cn,name:name,agent:agent,items:items,stages:stages});
    this.saveData();this.renderAll();this.closeFormModal();
    this.toast('项目创建成功','success');

  doImport:function(){
    var file=document.getElementById('importFile').files[0];
    if(!file){this.toast('请选择文件','error');return}
    var self=this;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var imported=JSON.parse(e.target.result);
        if(!Array.isArray(imported))throw new Error('格式不对');
        imported.forEach(function(imp){
          var idx=self.projects.findIndex(function(p){return p.id===imp.id});
          if(idx>=0)self.projects[idx]=imp;
          else self.projects.push(imp);
        });
        self.saveData();self.renderAll();self.closeImportModal();
        self.toast('导入成功，共'+imported.length+'条','success');
      }catch(err){self.toast('文件格式错误','error')}
    };
    reader.readAsText(file);
  },

  openAnalytics:function(){

  closeAnalytics:function(){document.getElementById('analyticsModal').style.display='none'},
  renderAnalytics:function(){
    var self=this;
    var total=this.projects.length;
    if(!total){
      document.getElementById('analyticsContent').innerHTML='<h2>数据分析</h2><div class="empty-state"><p>暂无数据，请先创建项目</p><button class="btn-sm btn-primary" onclick="APP.closeAnalytics()">关闭</button></div>';
      return;
    }

    // Compute stats
    var inProg=0,delayed=0,completed=0,pending=0;
    var stageStats={}; // {key: {inProg,delayed,done,pending,total}}
    STAGES.forEach(function(s){stageStats[s.key]={inProg:0,delayed:0,done:0,pending:0,total:0}});

    this.projects.forEach(function(p){
      var allDone=true;
      STAGES.forEach(function(s){
        var st=p.stages[s.key];
        var ss=stageStats[s.key];
        ss.total++;
        if(st&&st.s==='done')ss.done++;
        else if(isOverdue(st)){ss.delayed++;delayed++}
        else if(st&&st.s==='in-progress'){ss.inProg++;inProg++}
        else{ss.pending++;pending++}
        if(!st||st.s!=='done')allDone=false;
      });
      if(allDone)completed++;
    });

    // Overview
    var html='<h2>数据分析看板</h2>'+
      '<div class="analytics-grid">'+
        this._statCard(total,'项目总数','#4f46e5')+
        this._statCard(inProg,'进行中','#2563eb',Math.round(inProg/total*100)+'%')+
        this._statCard(delayed,'已超期','#dc2626',Math.round(delayed/total*100)+'%'+(delayed>0?' ⚠':' ✓'))+
        this._statCard(completed,'已完成','#059669',Math.round(completed/total*100)+'%')+
      '</div>';

    // Stage distribution bar chart — grouped bars with legend
    html+='<div class="analytics-section"><h3>阶段分布</h3><div class="chart-container">';
    var maxStageTotal=Math.max.apply(null,STAGES.map(function(s){return stageStats[s.key].total}),1);
    STAGES.forEach(function(s){
      var ss=stageStats[s.key];
      var dPct=Math.round(ss.done/maxStageTotal*100);
      var iPct=Math.round(ss.inProg/maxStageTotal*100);
      var dePct=Math.round(ss.delayed/maxStageTotal*100);
      html+='<div class="bar-row"><div class="bar-label">'+s.name+'</div><div class="bar-track">'+
        (ss.done?'<div class="bar-fill" style="width:'+dPct+'%;background:#059669;border-radius:4px"><span>'+ss.done+'</span></div>':'')+
        (ss.inProg?'<div class="bar-fill" style="width:'+iPct+'%;background:#2563eb;border-radius:4px;margin-left:2px"><span>'+ss.inProg+'</span></div>':'')+
        (ss.delayed?'<div class="bar-fill" style="width:'+dePct+'%;background:#dc2626;border-radius:4px;margin-left:2px"><span>'+ss.delayed+'</span></div>':'')+
        (!ss.done&&!ss.inProg&&!ss.delayed?'<div style="font-size:11px;color:#94a3b8;padding:2px 8px">'+ss.pending+' 待启动</div>':'')+
      '</div></div>';
    });
    // Legend
    html+='<div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--text3)">'+
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#059669;margin-right:3px;vertical-align:middle"></span>已完成</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#2563eb;margin-right:3px;vertical-align:middle"></span>进行中</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#dc2626;margin-right:3px;vertical-align:middle"></span>已超期</span>'+
    '</div>';
    html+='</div></div>';

    // Department workload + donut side by side
    html+='<div class="chart-row">';

    // Department workload
    html+='<div class="analytics-section" style="flex:1;min-width:260px"><h3>部门负荷</h3><div class="chart-container">';
    var maxDept=0;
    STAGES.forEach(function(s){maxDept=Math.max(maxDept,stageStats[s.key].inProg+stageStats[s.key].delayed)});
    STAGES.forEach(function(s){
      var ss=stageStats[s.key];
      var load=ss.inProg+ss.delayed;
      var pct=maxDept?Math.round(load/maxDept*100):0;
      html+='<div class="bar-row"><div class="bar-label">'+s.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+(ss.delayed>0?'#dc2626':'#4f46e5')+'"><span>'+load+'项'+(ss.delayed?' (超期'+ss.delayed+')':'')+'</span></div></div></div>';
    });
    html+='</div></div>';

    // Completion donut — count all done stages
    var doneStages=0,inProgStages=0,delayedStages=0,pendingStages=0;
    this.projects.forEach(function(p){
      STAGES.forEach(function(s){
        var st=p.stages[s.key];
        if(st&&st.s==='done')doneStages++;
        else if(isOverdue(st))delayedStages++;
        else if(st&&st.s==='in-progress')inProgStages++;
        else pendingStages++;
      });
    });
    var totalStages=total*7;
    var donePct=Math.round(doneStages/totalStages*100);
    var donutR=70,donutCx=90,donutCy=90,donutStroke=16;
    var circum=2*Math.PI*(donutR-donutStroke/2);
    var dashLen=circum*donePct/100;

    html+='<div class="analytics-section" style="flex:1;min-width:260px"><h3>总体完成率</h3><div class="chart-container donut-wrap">'+
      '<svg width="180" height="180" viewBox="0 0 180 180">'+
        '<circle cx="'+donutCx+'" cy="'+donutCy+'" r="'+(donutR-donutStroke/2)+'" fill="none" stroke="#e2e8f0" stroke-width="'+donutStroke+'"/>'+
        '<circle cx="'+donutCx+'" cy="'+donutCy+'" r="'+(donutR-donutStroke/2)+'" fill="none" stroke="#059669" stroke-width="'+donutStroke+'" stroke-dasharray="'+dashLen+' '+circum+'" stroke-linecap="round" transform="rotate(-90 '+donutCx+' '+donutCy+')"/>'+
        '<text x="'+donutCx+'" y="'+donutCy+'" text-anchor="middle" font-size="32" font-weight="800" fill="#1a1a2e">'+donePct+'%</text>'+
        '<text x="'+donutCx+'" y="'+(donutCy+20)+'" text-anchor="middle" font-size="11" fill="#64748b">'+doneStages+'/'+totalStages+' 阶段</text>'+
      '</svg>'+
      '<div class="legend">'+
        '<div class="legend-item"><div class="legend-dot" style="background:#059669"></div>已完成 '+doneStages+'</div>'+
        '<div class="legend-item"><div class="legend-dot" style="background:#2563eb"></div>进行中 '+inProgStages+'</div>'+
        '<div class="legend-item"><div class="legend-dot" style="background:#dc2626"></div>已超期 '+delayedStages+'</div>'+
        '<div class="legend-item"><div class="legend-dot" style="background:#94a3b8"></div>待启动 '+pendingStages+'</div>'+
      '</div>'+
    '</div></div>';

    html+='</div>'; // chart-row

    // Export button
    html+='<div style="display:flex;gap:8px;margin-top:6px">'+
      '<button class="btn-sm btn-outline" style="color:var(--success);flex:1" onclick="APP.exportExcel()">导出 Excel 报表</button>'+
      '<button class="btn-sm btn-gray" style="flex:1" onclick="APP.closeAnalytics()">关闭</button>'+
    '</div>';

    document.getElementById('analyticsContent').innerHTML=html;
  },

  _statCard:function(value,label,color,sub){
    return '<div class="analytics-card">'+
      '<div class="ac-value" style="color:'+color+'">'+value+'</div>'+
      '<div class="ac-label">'+label+'</div>'+
      (sub?'<div class="ac-sub">'+sub+'</div>':'')+
    '</div>';
  },

  // ==== EXPORT EXCEL (CSV with BOM) ====
  exportExcel:function(){
    var BOM='\uFEFF';
    // Header
    var cols=['合同号','项目名称','代理商','项目清单','当前阶段','当前状态'];
    STAGES.forEach(function(s){
      cols.push(s.name+'-状态');
      cols.push(s.name+'-开始日期');
      cols.push(s.name+'-截止日期');
      cols.push(s.name+'-处理人');
      cols.push(s.name+'-备注');
    });
    var csv=[cols.map(function(c){return '"'+c.replace(/"/g,'""')+'"'}).join(',')];

    // Data rows
    this.projects.forEach(function(p){
      // Find current stage
      var curIdx=0,curStatus='待启动';
      for(var i=0;i<STAGES.length;i++){
        var st=p.stages[STAGES[i].key];
        if(st&&st.s==='in-progress'){curIdx=i;curStatus='进行中';break}
        if(st&&st.s==='done'){curIdx=i;curStatus='已完成'}
        else if(curStatus==='已完成'&&st&&st.s==='pending'){curIdx=i;curStatus='待启动'}
      }
      var curSt=p.stages[STAGES[curIdx].key];
      if(isOverdue(curSt))curStatus='已超期';

      var row=[
        p.contractNo||'',
        p.name||'',
        p.agent||'',
        p.items||'',
        STAGES[curIdx].name,
        curStatus
      ];
      STAGES.forEach(function(s){
        var st=p.stages[s.key];
        row.push(st&&st.s?st.s==='done'?'已完成':st.s==='in-progress'?'进行中':'待启动':'待启动');
        row.push(st&&st.ds?st.ds:'');
        row.push(st&&st.de?st.de:'');
        row.push(st&&st.h?st.h:'');
        row.push(st&&st.n?st.n:'');
      });
      csv.push(row.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(','));
    });

    var blob=new Blob([BOM+csv.join('\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='感创项目报表_'+today()+'.csv';a.click();
    this.toast('Excel 报表已导出，'+this.projects.length+'个项目','success');
  },

  // ==== HELPERS ====
  findProject:function(pid){
    for(var i=0;i<this.projects.length;i++){if(this.projects[i].id===pid)return this.projects[i]}
    return null;
  },
  toast:function(msg,type){
    var existing=document.querySelector('.toast');if(existing)existing.remove();
    var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(function(){t.remove()},2500);
  }
};

// ==== INIT ====
if(document.readyState!=='loading')APP.init();
else document.addEventListener('DOMContentLoaded',function(){APP.init()});
</script>
</body>
