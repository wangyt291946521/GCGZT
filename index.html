<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>感创 · 项目信息流转平台</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#fff; --text:#1a1a2e; --text2:#64748b; --text3:#94a3b8;
  --border:#e2e8f0; --primary:#4f46e5; --primary-light:#eef2ff;
  --success:#059669; --warning:#d97706; --danger:#dc2626; --info:#2563eb;
  --radius:12px; --radius-sm:8px; --safe-bottom:env(safe-area-inset-bottom,0);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
input,textarea,select,button{font-family:inherit;font-size:16px;outline:none}
button{cursor:pointer;border:none;background:none;color:inherit}

/* === Top Bar === */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow);
}
.topbar .logo{font-size:18px;font-weight:700;white-space:nowrap;color:var(--primary)}
.topbar .logo span{font-weight:400;font-size:13px;color:var(--text2);margin-left:4px}
.topbar .spacer{flex:1}
.topbar .dept-select{
  padding:6px 12px;border-radius:20px;font-size:14px;font-weight:600;
  background:var(--primary-light);color:var(--primary);border:1.5px solid var(--primary);
  min-width:80px;text-align:center;appearance:none;-webkit-appearance:none;
}
.topbar .stat-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text2);
  background:var(--bg);padding:4px 10px;border-radius:20px;white-space:nowrap;
}
.topbar .stat-badge b{color:var(--text)}
.topbar .btn-icon{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .2s;
}
.topbar .btn-icon:hover{background:var(--bg)}

/* === Search === */
.search-bar{
  margin:12px 16px 0;position:relative;
}
.search-bar input{
  width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--border);
  border-radius:24px;font-size:15px;background:var(--surface);
  transition:border .2s;
}
.search-bar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.search-bar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3)}
.search-bar .clear-search{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;background:var(--border);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  color:var(--text2);display:none;
}

/* === Pipeline Bar === */
.pipeline-bar{
  display:flex;gap:0;padding:14px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.pipeline-bar::-webkit-scrollbar{display:none}
.pipeline-step{
  flex:1 0 80px;min-width:80px;text-align:center;padding:10px 4px;
  border-radius:var(--radius-sm);background:var(--surface);transition:all .2s;
  border:1.5px solid var(--border);position:relative;cursor:pointer;
}
.pipeline-step.active{border-color:var(--primary);background:var(--primary-light)}
.pipeline-step:hover{border-color:var(--primary)}
.pipeline-step .step-num{
  width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;margin-bottom:3px;
  background:var(--bg);color:var(--text3);
}
.pipeline-step.active .step-num{background:var(--primary);color:#fff}
.pipeline-step .step-name{font-size:11px;font-weight:600;color:var(--text2);line-height:1.3}
.pipeline-step.active .step-name{color:var(--primary)}
.pipeline-step .step-count{font-size:18px;font-weight:700;margin-top:1px}
.pipeline-step.active .step-count{color:var(--primary)}
.pipeline-step .step-sub{font-size:10px;color:var(--text3)}
/* Parallel pipeline steps */
.pipeline-step.parallel{border-style:dashed;border-color:#fcd34d}
.pipeline-step.parallel.active{border-color:var(--primary);border-style:solid}
.pipeline-step.parallel::after{font-size:16px}
.sp-dot.parallel{border-width:1.5px;border-style:dashed;border-color:#fcd34d}
.sp-dot.parallel.done{background:#059669;border-color:#059669;border-style:solid}
.sp-dot.parallel.in-progress{background:#4f46e5;border-color:#4f46e5;border-style:solid;box-shadow:0 0 0 3px rgba(79,70,229,.25)}
.sp-dot.parallel.delayed{background:#dc2626;border-color:#dc2626;border-style:solid}
.pipeline-step::after{
  content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);
  width:7px;height:7px;border-top:1.5px solid var(--border);
  border-right:1.5px solid var(--border);transform:translateY(-50%) rotate(45deg);
}
.pipeline-step:last-child::after{display:none}

/* === Section === */
.section{margin:0 16px 16px}
.section-title{
  font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.section-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.section-title .count{font-size:12px;color:var(--text3);font-weight:400}

/* === My Tasks === */
.my-task-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:6px;
  border:1px solid transparent;gap:8px;
}
.my-task-item .task-tag{
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;
}
.my-task-item .task-name{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* === Filter Tabs === */
.filter-tabs{
  display:flex;gap:4px;overflow-x:auto;padding:8px 16px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{
  padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
  white-space:nowrap;background:var(--surface);border:1.5px solid var(--border);
  color:var(--text2);transition:all .2s;
}
.filter-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* === Project Cards === */
.project-list{display:flex;flex-direction:column;gap:12px}
.project-card{
  background:var(--surface);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);border:1.5px solid var(--border);transition:all .2s;cursor:pointer;
}
.project-card:hover{box-shadow:var(--shadow-md)}
.project-card:active{transform:scale(.99)}
.project-card.needs-me{border-color:var(--warning);box-shadow:0 0 0 2px rgba(217,119,6,.15)}
.project-header{
  display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px;
}
.project-title{font-size:15px;font-weight:700;line-height:1.3}
.project-meta{font-size:12px;color:var(--text3);margin-top:2px}

/* Stage badge */
.stage-badge{
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;
}
.sb-pending{background:#f1f5f9;color:#64748b}
.sb-progress{background:#dbeafe;color:#2563eb}
.sb-done{background:#dcfce7;color:#059669}
.sb-delayed{background:#fef2f2;color:#dc2626}
.sb-delayed-done{background:#fff7ed;color:#ea580c}

/* Stage pipeline */
.stage-pipeline{
  display:flex;gap:3px;align-items:center;margin:8px 0;
}
.stage-pipeline .sp-dot{flex:1;height:6px;border-radius:3px;background:var(--border)}
.sp-dot.done{background:var(--success)}
.sp-dot.in-progress{background:var(--primary);height:8px;border-radius:4px}
.sp-dot.delayed{background:var(--danger)}
.sp-dot.delayed-done{background:#ea580c}
.sp-dot.parallel.delayed-done{background:#ea580c;border-color:#ea580c;border-style:solid}
.sp-dot.my-dept{background:var(--warning);animation:blink 1.5s infinite}
.sp-dot.skip{background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 3px,#f1f5f9 3px,#f1f5f9 6px);border:1px dashed #94a3b8}
.sb-skip{background:#f1f5f9;color:#94a3b8}
.stage-detail.skipped{background:#f8fafc;border-color:#e2e8f0;opacity:0.65}
.rd-support-badge{display:inline-flex;align-items:center;gap:3px;background:#fff7ed;color:#ea580c;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;border:1px solid #fdba74;white-space:nowrap}
.rd-support-section{background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:10px 12px;margin-top:6px}
.rd-support-section h4{font-size:12px;color:#92400e;margin-bottom:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* Stage labels row */
.stage-labels{
  display:flex;justify-content:space-between;margin:4px 0 8px;
}
.stage-labels span{font-size:10px;color:var(--text3)}
.stage-labels span.active{color:var(--primary);font-weight:700}
.stage-labels span.done{color:var(--success)}

/* Card footer */
.project-footer{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;
  font-size:12px;color:var(--text2);padding-top:10px;border-top:1px solid var(--border);
}
.project-footer .pf-info{display:flex;align-items:center;gap:4px}

/* === Buttons === */
.btn-sm{
  padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
  transition:all .2s;display:inline-flex;align-items:center;gap:4px;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-outline{background:var(--surface);color:var(--primary);border:1.5px solid var(--primary)}
.btn-outline:hover{background:var(--primary-light)}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-gray{background:var(--bg);color:var(--text);border:1.5px solid var(--border)}

/* === Action Bar === */
.action-bar{
  display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;
  position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:calc(12px + var(--safe-bottom));z-index:50;
}
.action-bar button{
  flex:1;min-width:80px;padding:10px;border-radius:22px;
  font-size:14px;font-weight:600;text-align:center;transition:all .2s;
}

/* === Modals === */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
}
@media(min-width:768px){.modal-overlay{align-items:center}}
.modal{
  background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:680px;
  max-height:90vh;overflow-y:auto;padding:24px 20px;
  box-shadow:0 -4px 24px rgba(0,0,0,.12);
}
@media(min-width:768px){.modal{border-radius:16px;margin:20px}}
.modal h2{font-size:20px;margin-bottom:14px;padding-right:28px}
.modal h3{font-size:15px;margin-bottom:10px}

/* Stage detail */
.stage-detail{
  padding:12px 14px;border-radius:var(--radius-sm);margin-bottom:8px;
  border:1.5px solid var(--border);
}
.stage-detail.current{background:var(--primary-light);border-color:var(--primary)}
.stage-detail.completed{background:#f0fdf4;border-color:#86efac}
.stage-detail.delayed-done{background:#fff7ed;border-color:#fdba74}
.stage-detail .sd-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;
}
.stage-detail .sd-label{font-weight:700;font-size:14px}
.stage-detail .sd-status{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;
}
.stage-detail .sd-info{font-size:13px;color:var(--text2);line-height:1.6}
.stage-detail .sd-edit{margin-top:6px}
.stage-detail .sd-edit input,.stage-detail .sd-edit textarea{
  width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;margin-top:4px;
}
.stage-detail .sd-edit textarea{min-height:40px;resize:vertical}
.stage-detail .sd-actions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}

/* Form */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;
  font-size:15px;transition:border .2s;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);
}
.form-group textarea{min-height:56px;resize:vertical}

/* Empty */
.empty-state{
  text-align:center;padding:40px 20px;color:var(--text3);
}
.empty-state svg{margin-bottom:10px;opacity:.4}

/* Toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;
  padding:10px 22px;border-radius:20px;font-size:14px;font-weight:600;
  color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .3s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--info)}

/* Confirm */
.confirm-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.confirm-box{
  background:var(--surface);border-radius:var(--radius);padding:24px;
  max-width:360px;width:100%;text-align:center;
}
.confirm-box h3{margin-bottom:8px}
.confirm-box p{color:var(--text2);font-size:14px;margin-bottom:18px}
.confirm-box .btn-row{display:flex;gap:8px}
.confirm-box .btn-row button{flex:1;padding:10px;border-radius:20px;font-weight:600;font-size:14px}

/* === Desktop === */
@media(min-width:768px){
  .topbar{padding:10px 24px}
  .search-bar{margin:12px 24px 0}
  .pipeline-bar{padding:14px 24px}
  .pipeline-step{min-width:auto;flex:1}
  .section{margin:0 24px 20px}
  .filter-tabs{padding:8px 24px}
  .action-bar{padding:12px 24px;padding-bottom:12px}
  .project-list{display:grid;grid-template-columns:repeat(2,1fr)}
}
/* === Gantt Chart === */
.gantt-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.gantt-modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:100vw;height:90vh;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.gantt-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.gantt-header h2{font-size:18px;margin:0}
.gantt-body{flex:1;overflow:auto;display:flex}
.gantt-labels{flex-shrink:0;width:140px;border-right:1px solid var(--border);background:var(--bg)}
@media(min-width:768px){.gantt-labels{width:200px}}
.gantt-label-item{padding:8px 10px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border);min-height:44px;display:flex;align-items:center;white-space:normal;word-break:break-all;line-height:1.3;cursor:pointer}
.gantt-label-item:hover{background:var(--primary-light)}
.gantt-chart{flex:1;overflow-x:auto;overflow-y:hidden}
.gantt-tooltip{position:absolute;background:#1a1a2e;color:#fff;font-size:11px;padding:6px 10px;border-radius:6px;pointer-events:none;z-index:400;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.gantt-legend{display:flex;gap:14px;align-items:center;margin-left:16px;flex-wrap:wrap}
.gantt-legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.gantt-legend-dot{width:10px;height:10px;border-radius:3px}

@media(min-width:1024px){
  .project-list{grid-template-columns:repeat(3,1fr)}
}

/* === Analytics === */
.analytics-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;
}
@media(min-width:768px){.analytics-grid{grid-template-columns:repeat(4,1fr)}}
.analytics-card{
  background:var(--bg);border-radius:var(--radius-sm);padding:14px;text-align:center;
  border:1.5px solid var(--border);
}
.analytics-card .ac-value{font-size:28px;font-weight:800;line-height:1.2}
.analytics-card .ac-label{font-size:12px;color:var(--text2);margin-top:2px}
.analytics-card .ac-sub{font-size:10px;color:var(--text3);margin-top:2px}

.analytics-section{
  margin-bottom:16px;
}
.analytics-section h3{
  font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text);
  display:flex;align-items:center;gap:6px;
}
.analytics-section h3::before{
  content:'';width:4px;height:16px;border-radius:2px;display:inline-block;
  background:var(--primary);
}
.chart-container{
  background:var(--surface);border-radius:var(--radius-sm);padding:16px;
  border:1.5px solid var(--border);overflow-x:auto;
}
.chart-row{display:flex;gap:12px;flex-wrap:wrap}
.chart-row>*{flex:1;min-width:260px}

/* Bar chart */
.bar-row{display:flex;align-items:center;margin-bottom:8px;gap:8px}
.bar-row .bar-label{width:70px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0;color:var(--text2)}
.bar-row .bar-track{flex:1;height:22px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
.bar-row .bar-fill{height:100%;border-radius:4px;transition:width .5s ease;display:flex;align-items:center;padding-left:8px}
.bar-row .bar-fill span{font-size:11px;font-weight:700;color:#fff;white-space:nowrap}

/* Donut */
.donut-wrap{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}

/* Legend */
.legend{display:flex;flex-direction:column;gap:4px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
</style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="topbar">
  <div class="logo">感创<span>| 项目流转</span></div>
  <div class="spacer"></div>
  <span class="stat-badge">共 <b id="totalProjects">0</b> 个项目</span>
  <select class="dept-select" id="deptSelect" onchange="APP.switchDept(this.value)">
    <option value="all">全部视角</option>
    <option value="项目部">项目部</option>
    <option value="采购部">采购部</option>
    <option value="研发部">研发部</option>
    <option value="生产部">生产部</option>
    <option value="发货">发货</option>
    <option value="维护部">维护部</option>
    <option value="财务部">财务部</option>
  </select>
  <span id="modeBadge" style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap"></span>
  <button class="btn-icon" onclick="APP.openAnalytics()" title="数据分析" style="font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-light);border-radius:16px;padding:5px 12px;width:auto;gap:3px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>
    分析
  </button>
  <button class="btn-icon" onclick="APP.openGantt()" title="甘特图" style="font-size:13px;font-weight:600;color:#059669;background:#dcfce7;border-radius:16px;padding:5px 12px;width:auto;gap:3px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="4" rx="1" fill="#059669"/><rect x="5" y="11" width="14" height="4" rx="1" fill="#059669"/><rect x="3" y="18" width="18" height="4" rx="1" fill="#059669"/></svg>
    甘特图
  </button>
  <button class="btn-icon" onclick="APP.openBackup()" title="数据管理">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
  </button>
</div>

<!-- ===== Search ===== -->
<div class="search-bar">

<script>
// ===== 部署配置 =====
// GC_API_BASE 留空即可自动检测；手动填写则强制使用指定地址
var GC_API_BASE = '';

// ===== API MODE: smart auto-detect =====
// Railway 自身 → 同源 /api
// CloudStudio/Vercel 等静态托管 → 自动指向 Railway
// 本地文件 → localStorage only
var API_BASE = (function(){
  if(GC_API_BASE) return GC_API_BASE.replace(/\/+$/,'')+'/api';
  // 部署在 Railway 自身 → 同源 API
  if(window.location.hostname.includes('railway.app')) return '/api';
  // 本地开发服务器（node server.js）
  if(window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1') return '/api';
  // CloudStudio / Vercel 等纯静态托管 → 自动指向 Railway 后端
  if(window.location.protocol==='https:'||window.location.protocol==='http:') return 'https://gcgzt-production.up.railway.app/api';
  // 本地 HTML 文件 → 仅 localStorage
  return '';
})();

// ===== STAGES =====
var STAGES = [
  {key:'order',    name:'执行单',   dept:'项目部', desc:'合同号、项目名称、代理商、项目清单'},
  {key:'purchase', name:'采购',     dept:'采购部', desc:'采购时间、到货情况',           parallel:true},
  {key:'dev',      name:'研发',     dept:'研发部', desc:'定制开发内容与进度',           parallel:true},
  {key:'production',name:'生产',    dept:'生产部', desc:'设备生产与安装情况',           parallel:true},
  {key:'shipping', name:'发货',     dept:'发货',   desc:'发货日期与物流信息'},
  {key:'maintenance',name:'维护开通',dept:'维护部', desc:'开通日期与备注'},
  {key:'payment',  name:'回款',     dept:'财务部', desc:'回款日期、金额、状态'}
];
var PARALLEL_KEYS = ['purchase','dev','production']; // 并行阶段组

// ===== HELPERS =====
function today(){return new Date().toISOString().split('T')[0]}
function daysAgo(d){if(!d)return 0;return Math.floor((new Date()-new Date(d+'T00:00:00'))/86400000)}
function isOverdue(st){return st&&st.s==='in-progress'&&st.de&&st.de<today()}
function isStageDelayed(st){return st&&st.s==='done'&&st.delayed===true}
function isSkipped(st){return st&&st.s==='skip'}
function isParallelStage(key){return PARALLEL_KEYS.indexOf(key)>=0}
// 判断某阶段的前置阶段是否已完成（done 或 skip）
// 依赖链：order → 并行组(purchase/dev/production) → shipping → maintenance → payment
function _prevStageDone(p,sk){
  if(sk==='order')return true;
  if(isParallelStage(sk))return p.stages.order&&(p.stages.order.s==='done'||p.stages.order.s==='skip');
  if(sk==='shipping')return PARALLEL_KEYS.every(function(k){var st=p.stages[k];return st&&(st.s==='done'||st.s==='skip')});
  if(sk==='maintenance')return p.stages.shipping&&(p.stages.shipping.s==='done'||p.stages.shipping.s==='skip');
  if(sk==='payment')return p.stages.maintenance&&(p.stages.maintenance.s==='done'||p.stages.maintenance.s==='skip');
  return true;
}
// 找项目的「当前阶段」：跳过已完成和已跳过的顺序阶段，并行组里任一个进行中都算当前
// 如果并行组全部完成或跳过，才继续往下走到发货
function findCurrentStageIdx(p){
  // 并行组"完成"= done 或 skip 都算
  var allParallelDone = PARALLEL_KEYS.every(function(k){var st=p.stages[k];return st&&(st.s==='done'||st.s==='skip')});
  // 如果并行组未全部完成，当前阶段在并行组内找第一个进行中的（或第一个待启动的，跳过skip）
  if(!allParallelDone){
    for(var i=0;i<STAGES.length;i++){
      if(isParallelStage(STAGES[i].key)){
        var st=p.stages[STAGES[i].key];
        if(st&&(st.s==='in-progress'||st.s==='pending'))return i; // 第一个未完成且未跳过的并行阶段
      }
    }
    return 1; // 默认指向第一个并行阶段（采购）
  }
  // 并行组全部完成/跳过，按顺序往下找（跳过skip）
  for(var i=0;i<STAGES.length;i++){
    var st=p.stages[STAGES[i].key];
    if(!isParallelStage(STAGES[i].key)){
      if(st&&st.s==='in-progress')return i;
      if(st&&st.s==='pending')return i;
    }
  }
  // 检查是否有顺序阶段在并行组之前未完成
  var orderSt=p.stages.order;
  if(orderSt&&orderSt.s==='pending')return 0;
  return STAGES.length-1;
}

// ===== DEMO DATA =====
// stage model: {s:'pending'|'in-progress'|'done', ds:开始日期, de:截止/完成日期, h:处理人, n:备注}
var DEMO = [
  {id:'P2026-001',contractNo:'20260308001',name:'深圳南山图书馆智能借还系统',agent:'深圳智慧科技',items:'借还书机×8, RFID安全门×4',
    stages:{order:{s:'done',ds:'2026-03-01',de:'2026-03-10',h:'张经理',n:''},purchase:{s:'done',ds:'2026-03-15',de:'2026-03-25',h:'李采购',n:'全部到货'},dev:{s:'done',ds:'2026-03-26',de:'2026-04-15',h:'王工',n:'定制借还流程适配完成'},production:{s:'in-progress',ds:'2026-04-16',de:'2026-08-12',h:'赵生产',n:'设备组装中'},shipping:{s:'pending',ds:'',de:'',h:'',n:''},maintenance:{s:'pending',ds:'',de:'',h:'',n:''},payment:{s:'pending',ds:'',de:'',h:'',n:''}}},
  {id:'P2026-002',contractNo:'20260415002',name:'广州天河区图书馆门禁系统',agent:'广州博学科技',items:'RFID通道门×6, 检测仪×2',
    stages:{order:{s:'done',ds:'2026-04-10',de:'2026-04-16',h:'刘经理',n:''},purchase:{s:'in-progress',ds:'2026-04-17',de:'2026-08-20',h:'李采购',n:'下单完成,等待到货'},dev:{s:'skip',ds:'',de:'',h:'',n:'标准品无需研发'},production:{s:'pending',ds:'',de:'',h:'',n:''},shipping:{s:'pending',ds:'',de:'',h:'',n:''},maintenance:{s:'pending',ds:'',de:'',h:'',n:''},payment:{s:'pending',ds:'',de:'',h:'',n:''}}},
  {id:'P2026-003',contractNo:'20260108003',name:'北京海淀区智慧图书馆整体方案',agent:'北京文轩信息',items:'借还机×12,盘点车×3,工作站×5,标签×5万',
    stages:{order:{s:'done',ds:'2026-01-10',de:'2026-01-25',h:'陈总监',n:'合同金额¥280万'},purchase:{s:'done',ds:'2026-01-26',de:'2026-02-15',h:'李采购',n:'分批到货'},dev:{s:'done',ds:'2026-02-16',de:'2026-03-20',h:'王工',n:'接口开发完成'},production:{s:'done',ds:'2026-03-21',de:'2026-04-30',h:'赵生产',n:'安装调试完成'},shipping:{s:'done',ds:'2026-05-01',de:'2026-05-10',dr:'2026-05-13',delayed:true,h:'孙物流',n:'已发货'},maintenance:{s:'in-progress',ds:'2026-05-11',de:'2026-07-28',h:'周维护',n:'等待客户确认中',rdNeeded:true,rdHandler:'王工',rdDate:'2026-07-15',rdNote:'现场调试时发现RFID读取范围异常，需研发到场排查'},payment:{s:'pending',ds:'',de:'',h:'',n:''}}},
  {id:'P2026-004',contractNo:'20260501004',name:'成都锦江区24小时自助图书馆',agent:'成都数图科技',items:'自助借还柜×2,门禁×1',
    stages:{order:{s:'done',ds:'2026-05-05',de:'2026-05-10',h:'张经理',n:''},purchase:{s:'pending',ds:'',de:'',h:'',n:''},dev:{s:'pending',ds:'',de:'',h:'',n:''},production:{s:'pending',ds:'',de:'',h:'',n:''},shipping:{s:'pending',ds:'',de:'',h:'',n:''},maintenance:{s:'pending',ds:'',de:'',h:'',n:''},payment:{s:'pending',ds:'',de:'',h:'',n:''}}}
];

// ===== APP =====
var APP = {
  dept:'all',
  filter:'all',
  projects:[],
  confirmCb:null,
  searchText:'',

  init:function(){
    this.updateModeBadge();
    this.loadData();
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){APP.closeDetailModal();APP.closeFormModal();}});
  },

  updateModeBadge:function(){
    var badge=document.getElementById('modeBadge');
    if(API_BASE){
      if(API_BASE.indexOf('railway.app')>=0){
        badge.textContent='数据同步至Railway';
      }else{
        badge.textContent='在线(数据存本地)';
      }
      badge.style.background='#dbeafe';badge.style.color='#2563eb';
    }else{
      badge.textContent='本地模式';
      badge.style.background='#fef3c7';badge.style.color='#d97706';
    }
  },

  // ==== DATA ====
  loadData:function(){
    var self=this;
    if(API_BASE){
      // 刷新时始终从服务器拉最新数据（覆盖本地缓存）
      fetch(API_BASE+'/projects')
        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
        .then(function(data){
          self.projects=data;
          self._migrateStages();
          // 同步到本地缓存
          localStorage.setItem('wb_gc_projects_v2',JSON.stringify(data));
          if(!self.projects.length){self.projects=JSON.parse(JSON.stringify(DEMO));self.saveData()}
          self.renderAll();
        })
        .catch(function(e){
          // 服务器不可用 → 降级使用 localStorage 缓存
          console.log('服务器不可用，使用本地缓存:',e.message);
          var local=localStorage.getItem('wb_gc_projects_v2');
          if(local){try{self.projects=JSON.parse(local)}catch(e){self.projects=[]}}
          self._migrateStages();
          if(!self.projects.length){self.projects=JSON.parse(JSON.stringify(DEMO));self.saveData()}
          self.renderAll();
        });
    }else{
      // 纯本地模式
      var local=localStorage.getItem('wb_gc_projects_v2');
      if(local){try{this.projects=JSON.parse(local)}catch(e){this.projects=[]}}
      this._migrateStages();
      if(!this.projects.length){this.projects=JSON.parse(JSON.stringify(DEMO));self.saveData()}
      this.renderAll();
    }
  },

  _migrateStages:function(){
    var migrated=false;
    for(var i=0;i<this.projects.length;i++){
      var p=this.projects[i];
      for(var j=0;j<STAGES.length;j++){
        var st=p.stages[STAGES[j].key];
        if(st&&st.hasOwnProperty('d')&&!st.hasOwnProperty('ds')){
          st.ds=st.s==='done'||st.s==='in-progress'||st.s==='delayed'?st.d:'';
          st.de=st.d||'';
          delete st.d;
          if(st.s==='delayed')st.s='in-progress';
          migrated=true;
        }
        // Migrate: add dr (actual completion date) for done stages
        if(st&&st.s==='done'&&!st.hasOwnProperty('dr')){
          st.dr=st.de||'';migrated=true;
        }
      }
    }
    if(migrated)this.saveData();
  },

  saveData:function(){
    // 始终写入 localStorage（第一优先级）
    localStorage.setItem('wb_gc_projects_v2',JSON.stringify(this.projects));
    // API 模式下同步到服务器（备份）
    if(API_BASE){
      fetch(API_BASE+'/projects',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.projects)})
        .catch(function(){});
    }
    // 备份提醒
    if(this.projects.length>=10&&!localStorage.getItem('wb_gc_backup_hint2')){
      localStorage.setItem('wb_gc_backup_hint2','1');
      this.toast('数据已积累'+this.projects.length+'条,建议导出备份','info');
    }
  },

  // ==== SEARCH ====
  doSearch:function(){
    this.searchText=document.getElementById('searchInput').value.trim().toLowerCase();
    var btn=document.getElementById('clearSearch');
    btn.style.display=this.searchText?'flex':'none';
    this.renderProjectList();
  },
  clearSearch:function(){
    document.getElementById('searchInput').value='';
    this.searchText='';
    document.getElementById('clearSearch').style.display='none';
    this.renderProjectList();
  },

  // ==== DEPT ====
  switchDept:function(d){
    this.dept=d;
    if(d==='all'&&this.filter==='my')this.filter='all';
    this.renderAll();
  },
  setFilter:function(f){
    this.filter=f;
    var tabs=document.querySelectorAll('.filter-tab');
    for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
    document.querySelectorAll('.filter-tab').forEach(function(t){
      if(t.textContent.trim()===APP.filterLabel(f))t.classList.add('active');
    });
    this.renderProjectList();
  },
  filterLabel:function(f){
    var m={all:'全部项目',my:'需要我处理',active:'进行中',delayed:'已超期',done:'已完成'};
    return m[f]||f;
  },

  // ==== GET STAGE FOR DEPT ====
  stageKeyFor:function(dept){
    for(var i=0;i<STAGES.length;i++){if(STAGES[i].dept===dept)return STAGES[i].key}
    return 'order';
  },

  // ==== RENDER ALL ====
  renderAll:function(){
    this.renderPipeline();
    this.renderMyTasks();
    this.renderProjectList();
    document.getElementById('totalProjects').textContent=this.projects.length;
  },

  // ---- Pipeline Bar ----
  renderPipeline:function(){
    var self=this,html='';
    for(var i=0;i<STAGES.length;i++){
      var s=STAGES[i];
      var inProg=0,overdue=0,pending=0;
      this.projects.forEach(function(p){
        var st=p.stages[s.key];
        if(st&&isOverdue(st))overdue++;
        else if(st&&st.s==='in-progress')inProg++;
        // pending 只在前置阶段完成后才计入
        if((!st||st.s==='pending')&&_prevStageDone(p,s.key))pending++;
      });
      var isActive=(self.dept==='all'||self.dept===s.dept);
      var ovTxt=overdue?' <span style="color:var(--danger);font-size:10px">('+overdue+'超期)</span>':'';
      var parallelMark=s.parallel?'<div style="font-size:9px;color:var(--primary);margin-top:2px">∥ 并行</div>':'';
      html+='<div class="pipeline-step'+(isActive?' active':'')+(s.parallel?' parallel':'')+'" onclick="APP.switchDept(\''+s.dept+'\')">'+
        '<div class="step-num">'+(i+1)+'</div>'+
        '<div class="step-name">'+s.name+'</div>'+
        '<div class="step-count">'+(inProg+overdue)+'</div>'+
        '<div class="step-sub">进行中'+ovTxt+' | '+pending+'待处理</div>'+parallelMark+
      '</div>';
    }
    document.getElementById('pipelineBar').innerHTML=html;
  },

  // ---- My Tasks ----
  renderMyTasks:function(){
    var sec=document.getElementById('myTasksSection');
    if(this.dept==='all'){
      var inP=0,delayed=0,pending=0;
      this.projects.forEach(function(p){
        var hasInProg=false,hasDelayed=false;
        STAGES.forEach(function(s){
          var st=p.stages[s.key];
          if(st&&st.s==='in-progress')hasInProg=true;
          if(isOverdue(st))hasDelayed=true;
        });
        if(hasDelayed)delayed++;
        else if(hasInProg)inP++;
        else{
          var anyDone=false;
          for(var i=0;i<STAGES.length;i++){
            var st=p.stages[STAGES[i].key];
            if(st&&st.s==='done')anyDone=true;
            else if(anyDone||(st&&st.s==='pending')){pending++;break}
          }
          if(!anyDone)pending++;
        }
      });
      var done=this.projects.filter(function(p){
        return STAGES.every(function(s){var st=p.stages[s.key];return st&&(st.s==='done'||st.s==='skip')});
      }).length;
      sec.innerHTML='<div class="section-title"><span class="dot" style="background:var(--info)"></span>全局概览</div>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
        '<div style="flex:1;min-width:70px;background:var(--surface);border-radius:8px;padding:10px 8px;text-align:center;border:1px solid var(--border)"><div style="font-size:22px;font-weight:700;color:var(--primary)">'+inP+'</div><div style="font-size:11px;color:var(--text2)">进行中</div></div>'+
        '<div style="flex:1;min-width:70px;background:var(--surface);border-radius:8px;padding:10px 8px;text-align:center;border:1px solid var(--border)"><div style="font-size:22px;font-weight:700;color:var(--danger)">'+delayed+'</div><div style="font-size:11px;color:var(--text2)">已延期</div></div>'+
        '<div style="flex:1;min-width:70px;background:var(--surface);border-radius:8px;padding:10px 8px;text-align:center;border:1px solid var(--border)"><div style="font-size:22px;font-weight:700;color:var(--warning)">'+pending+'</div><div style="font-size:11px;color:var(--text2)">待启动</div></div>'+
        '<div style="flex:1;min-width:70px;background:var(--surface);border-radius:8px;padding:10px 8px;text-align:center;border:1px solid var(--border)"><div style="font-size:22px;font-weight:700;color:var(--success)">'+done+'</div><div style="font-size:11px;color:var(--text2)">已完成</div></div>'+
        '</div>';
      return;
    }

    var sk=this.stageKeyFor(this.dept);
    var stageName='';for(var i=0;i<STAGES.length;i++){if(STAGES[i].key===sk){stageName=STAGES[i].name;break}}
    var overdue=[],inProg=[],waiting=[];
    var self=this;
    this.projects.forEach(function(p){
      var st=p.stages[sk];if(!st)return;
      if(isOverdue(st))overdue.push(p);
      else if(st.s==='in-progress')inProg.push(p);
      else if(st.s==='pending'&&_prevStageDone(p,sk))waiting.push(p);
    });

    var html='';
    if(overdue.length){
      for(var i=0;i<overdue.length;i++){
        var p=overdue[i];
        html+='<div class="my-task-item" style="background:#fef2f2;border-color:#fecaca">'+
          '<span class="task-tag" style="background:#dc2626;color:#fff">逾期</span>'+
          '<span class="task-name">'+p.name+'</span>'+
          '<button class="btn-sm btn-danger" onclick="event.stopPropagation();APP.openDetail(\''+p.id+'\')">处理</button></div>';
      }
    }
    if(inProg.length){
      for(var i=0;i<inProg.length;i++){
        var p=inProg[i];
        html+='<div class="my-task-item" style="background:#dbeafe;border-color:#bfdbfe">'+
          '<span class="task-tag" style="background:#2563eb;color:#fff">进行中</span>'+
          '<span class="task-name">'+p.name+'</span>'+
          '<button class="btn-sm btn-primary" onclick="event.stopPropagation();APP.openDetail(\''+p.id+'\')">处理</button></div>';
      }
    }
    if(waiting.length&&waiting.length<=6){
      for(var i=0;i<Math.min(waiting.length,6);i++){
        var p=waiting[i];
        html+='<div class="my-task-item" style="background:var(--bg);border-color:var(--border)">'+
          '<span class="task-tag" style="background:#e2e8f0;color:#64748b">待启动</span>'+
          '<span class="task-name">'+p.name+'</span>'+
          '<button class="btn-sm btn-outline" onclick="event.stopPropagation();APP.openDetail(\''+p.id+'\')">处理</button></div>';
      }
    }
    if(!html)html='<div style="color:var(--text3);font-size:13px;padding:14px;text-align:center;background:var(--surface);border-radius:8px;border:1px solid var(--border)">当前没有待处理的任务</div>';

    sec.innerHTML='<div class="section-title"><span class="dot" style="background:var(--warning)"></span>'+this.dept+' · '+stageName+'任务 ('+(overdue.length+inProg.length+waiting.length)+'项)</div>'+html;
  },

  // ---- Project List ----
  renderProjectList:function(){
    var list=this.projects.slice();
    var titleEl=document.getElementById('listTitle');
    var countEl=document.getElementById('listCount');

    // Search filter
    if(this.searchText){
      list=list.filter(function(p){
        var txt=(p.name+' '+p.contractNo+' '+p.agent+' '+p.items).toLowerCase();
        return txt.indexOf(APP.searchText)>=0;
      });
      titleEl.textContent='搜索结果';
    }
    // Dept filter
    else if(this.filter==='my'&&this.dept!=='all'){
      var sk=this.stageKeyFor(this.dept);
      list=list.filter(function(p){var st=p.stages[sk];if(!st)return false;if(st.s==='in-progress'||isOverdue(st))return true;if(st.s==='pending')return _prevStageDone(p,sk);return false});
      titleEl.textContent='需要我处理';
    }else if(this.filter==='active'){
      list=list.filter(function(p){return STAGES.some(function(s){var st=p.stages[s.key];return st&&st.s==='in-progress'})});
      titleEl.textContent='进行中的项目';
    }else if(this.filter==='delayed'){
      list=list.filter(function(p){return STAGES.some(function(s){return isOverdue(p.stages[s.key])})});
      titleEl.textContent='已超期的项目';
    }else if(this.filter==='done'){
      list=list.filter(function(p){return STAGES.every(function(s){var st=p.stages[s.key];return st&&(st.s==='done'||st.s==='skip')})});
      titleEl.textContent='已完成的项目';
    }else{
      titleEl.textContent='全部项目';
    }
    countEl.textContent='('+list.length+')';

    var container=document.getElementById('projectList');
    var empty=document.getElementById('emptyState');

    if(!list.length){
      container.innerHTML='';
      empty.style.display='block';
      document.getElementById('emptyMsg').textContent=this.searchText?'没有找到匹配的项目':'暂无项目数据';
      return;
    }
    empty.style.display='none';

    var self=this;
    var cardsHtml='';
    for(var ci=0;ci<list.length;ci++){
      try{cardsHtml+=self.cardHTML(list[ci])}catch(e){
        console.error('卡片渲染异常:',list[ci].id,e);
        cardsHtml+='<div class="project-card" style="border-color:#fecaca"><div class="project-title">'+list[ci].name+'</div><div style="font-size:12px;color:var(--danger)">(渲染异常，请检查数据)</div></div>';
      }
    }
    container.innerHTML=cardsHtml;

    // Update filter tab
    var tabs=document.querySelectorAll('.filter-tab');
    for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
    tabs.forEach(function(t){if(t.textContent.trim()===self.filterLabel(self.filter))t.classList.add('active')});
  },

  // ---- Card ----
  cardHTML:function(p){
    // Find current stage — overdue is computed, not stored
    // Use parallel-aware current stage finder
    var curIdx=findCurrentStageIdx(p);
    var curSt=p.stages[STAGES[curIdx].key];
    var curStatus=(curSt&&curSt.s)?curSt.s:'pending';
    var stageOverdue=isOverdue(curSt);
    var isInParallel=isParallelStage(STAGES[curIdx].key);

    // myIdx: index of the stage belonging to the current department
    var myIdx=-1;
    if(this.dept!=='all'){
      for(var mi=0;mi<STAGES.length;mi++){
        if(STAGES[mi].dept===this.dept){myIdx=mi;break}
      }
    }

    // allDone: are ALL stages complete (done or skip)?
    var allDone=STAGES.every(function(s){var st=p.stages[s.key];return st&&(st.s==='done'||st.s==='skip')});

    // Count active parallel stages
    var parallelActive=0,parallelDone=0,parallelSkip=0;
    if(curIdx>=1&&curIdx<=3){
      PARALLEL_KEYS.forEach(function(k){
        var st=p.stages[k];
        if(st&&st.s==='in-progress')parallelActive++;
        if(st&&st.s==='done')parallelDone++;
        if(st&&st.s==='skip')parallelSkip++;
      });
    }

    // Check if dev is skipped for badge
    var devSkipped=p.stages.dev&&p.stages.dev.s==='skip';
    // Check if maintenance needs R&D support
    var rdNeeded=p.stages.maintenance&&p.stages.maintenance.rdNeeded;

    // Badge
    var badgeCls='sb-pending',badgeText='待启动';
    if(stageOverdue){badgeCls='sb-delayed';badgeText=STAGES[curIdx].name+' · 已超期'+daysAgo(curSt.de)+'天'}
    else if(curStatus==='skip'){badgeCls='sb-skip';badgeText=STAGES[curIdx].name+' · 已跳过'}
    else if(curStatus==='in-progress'){
      badgeCls='sb-progress';
      badgeText=isInParallel&&parallelActive>1?
        '并行阶段 · '+parallelActive+'部门处理中':
        (isInParallel?'并行阶段 · '+STAGES[curIdx].name+'中':'第'+(curIdx+1)+'步 · '+STAGES[curIdx].name+'中');
    }
    else if(curStatus==='done'){
      badgeCls='sb-done';badgeText=allDone?'全部完成':('等待后续阶段');
    }
    else if(curIdx>0){badgeText='待'+STAGES[curIdx].dept+'处理'}

    // Stage dots — highlight parallel group
    var dots='';
    for(var i=0;i<STAGES.length;i++){
      var st=p.stages[STAGES[i].key];
      var cls='sp-dot';
      if(isParallelStage(STAGES[i].key))cls+=' parallel';
      if(st&&st.s==='done'){
        cls+=isStageDelayed(st)?' delayed-done':' done';
      }
      else if(st&&st.s==='skip')cls+=' skip';
      else if(isOverdue(st))cls+=' delayed';
      else if(i===curIdx&&curStatus==='in-progress'&&!stageOverdue)cls+=' in-progress';
      if(i===myIdx&&st&&st.s!=='done'&&st.s!=='in-progress'&&st.s!=='skip')cls+=' my-dept';
      dots+='<div class="'+cls+'" title="'+STAGES[i].name+(isParallelStage(STAGES[i].key)?' (并行)':'')+(isStageDelayed(st)?' (延期完成)':'')+(isSkipped(st)?' (已跳过)':'')+'"></div>';
    }

    // Stage labels
    var labels='';
    for(var i=0;i<STAGES.length;i++){
      var st=p.stages[STAGES[i].key];
      var done=st&&st.s==='done';
      var delayedDone=isStageDelayed(st);
      var skipped=isSkipped(st);
      var over=isOverdue(st);
      var cls=done?'done':'';
      var labelText=STAGES[i].name;
      var labelStyle='';
      if(skipped){labelText='⊘ '+STAGES[i].name;labelStyle='color:#94a3b8;text-decoration:line-through'}
      else if(delayedDone){labelText='⚠ '+STAGES[i].name;labelStyle='color:#ea580c;font-weight:700'}
      else if(done){labelText='✓ '+STAGES[i].name}
      else if(over){labelText='⚠ '+STAGES[i].name;labelStyle='color:var(--danger);font-weight:700';cls='active'}
      labels+='<span class="'+cls+'"'+(labelStyle?' style="'+labelStyle+'"':'')+'>'+labelText+'</span>';
    }

    // Action button
    var actionBtn='';
    if(this.dept!=='all'&&myIdx>=0&&curIdx===myIdx){
      if(stageOverdue){
        actionBtn='<button class="btn-sm btn-warning" onclick="event.stopPropagation();APP.completeMyStage(\''+p.id+'\')">标记完成</button>';
      }else if(curStatus==='in-progress'){
        actionBtn='<button class="btn-sm btn-success" onclick="event.stopPropagation();APP.completeMyStage(\''+p.id+'\')">标记完成</button>';
      }else if(curStatus==='pending'&&_prevStageDone(p,STAGES[myIdx].key)){
        actionBtn='<button class="btn-sm btn-primary" onclick="event.stopPropagation();APP.startMyStage(\''+p.id+'\')">开始处理</button>';
      }
    }else if(this.dept==='all'){
      actionBtn='<button class="btn-sm btn-outline" onclick="event.stopPropagation();APP.openDetail(\''+p.id+'\')">查看</button>';
    }

    // Need-me highlight
    var needsMe=(this.dept!=='all'&&myIdx>=0&&curIdx===myIdx)?' needs-me':'';

    // Extra tags: skip tag + R&D support badge
    var extraTags='';
    if(devSkipped)extraTags+='<span class="rd-support-badge" style="background:#f1f5f9;color:#94a3b8;border-color:#cbd5e1">⊘ 无研发</span>';
    if(rdNeeded)extraTags+='<span class="rd-support-badge">需研发支援</span>';

    return '<div class="project-card'+needsMe+'" onclick="APP.openDetail(\''+p.id+'\')">'+
      '<div class="project-header">'+
        '<div><div class="project-title">'+p.name+'</div><div class="project-meta">合同号：'+p.contractNo+' · '+p.agent+'</div>'+(extraTags?'<div style="margin-top:4px">'+extraTags+'</div>':'')+'</div>'+
        '<span class="stage-badge '+badgeCls+'">'+badgeText+'</span>'+
      '</div>'+
      '<div class="stage-pipeline">'+dots+'</div>'+
      '<div class="stage-labels">'+labels+'</div>'+
      '<div class="project-footer">'+
        (function(){
          if(curStatus==='done'&&allDone)return '<span style="color:var(--success);font-weight:600">✓ 全部完成</span>';
          if(curStatus==='done')return '<span style="color:var(--text2)">待'+STAGES[curIdx].dept+'处理</span>';
          if(stageOverdue)return '<span style="color:var(--danger)">'+STAGES[curIdx].dept+'已超期'+daysAgo(curSt.de)+'天</span>';
          if(isInParallel&&parallelActive>1)return '<span style="color:var(--primary)">'+parallelActive+'部门并行处理中</span>';
          if(curStatus==='in-progress')return '<span>'+STAGES[curIdx].dept+'处理中'+(curSt.de?' · 截止'+curSt.de:'')+'</span>';
          return '<span>等待'+STAGES[curIdx].dept+'处理</span>';
        })()+
        actionBtn+
      '</div>'+
    '</div>';
  },

  // ==== DETAIL MODAL ====
  openDetail:function(pid){
    var p=this.findProject(pid);if(!p)return;

    var self=this;
    var html='<h2>'+p.name+'</h2>'+
      '<div style="color:var(--text2);font-size:13px;margin-bottom:16px;line-height:1.8">'+
        '<div>合同号：'+(p.contractNo||'未填')+'</div>'+
        '<div>代理商：'+(p.agent||'未填')+'</div>'+
        '<div>项目清单：'+(p.items||'未填')+'</div>'+
      '</div>';

    for(var i=0;i<STAGES.length;i++){
      var s=STAGES[i];
      var st=p.stages[s.key];
      var status=(st&&st.s)?st.s:'pending';

      // Parallel group header
      if(s.parallel&&i===1){
        html+='<div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:8px 12px;margin-bottom:4px;display:flex;align-items:center;gap:6px">'+
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 4v16m-8-8h16" stroke="#d97706" stroke-width="2"/></svg>'+
          '<span style="font-size:12px;color:#92400e;font-weight:600">并行阶段</span>'+
          '<span style="font-size:11px;color:#a16207">— 采购、研发、生产可同步进行，全部完成后自动进入发货</span>'+
        '</div>';
      }

      var over=isOverdue(st);
      var delayed=isStageDelayed(st);
      var skipped=isSkipped(st);
      var label='待启动',color='#94a3b8',bg='#f1f5f9';
      if(status==='skip'){label='已跳过';color='#94a3b8';bg='#f1f5f9'}
      else if(status==='done'){
        if(delayed){label='延期完成';color='#ea580c';bg='#fff7ed'}
        else{label='已完成';color='#059669';bg='#dcfce7'}
      }
      else if(over){label='已超期'+daysAgo(st.de)+'天';color='#dc2626';bg='#fecaca'}
      else if(status==='in-progress'){label='进行中';color='#4f46e5';bg='#dbeafe'}

      var isMine=(self.dept===s.dept&&self.dept!=='all');
      var isAllView=(self.dept==='all');
      var actions='';
      if(skipped){
        // Allow anyone to restore a skipped stage
        actions='<button class="btn-sm btn-gray" onclick="APP.unskipStage(\''+pid+'\',\''+s.key+'\')">恢复此阶段</button>';
      }else if(isMine){
        if(status==='pending'){
          if(_prevStageDone(p,s.key)){
            actions='<button class="btn-sm btn-primary" onclick="APP.startStage(\''+pid+'\',\''+s.key+'\')">开始处理</button>';
            // Allow skipping for pending stages (especially dev)
            actions+=' <button class="btn-sm btn-gray" onclick="APP.skipStage(\''+pid+'\',\''+s.key+'\')">跳过</button>';
          }else{
            actions='<span style="color:var(--text2);font-size:12px">等待前置阶段完成</span>';
          }
        }
        if(status==='in-progress'||over){
          actions='<button class="btn-sm btn-success" onclick="APP.completeStage(\''+pid+'\',\''+s.key+'\')">标记完成</button>';
        }
        if(status!=='pending'){
          actions+=' <button class="btn-sm btn-gray" onclick="APP.toggleNoteEdit(\''+pid+'\',\''+s.key+'\')">编辑备注</button>';
        }
      }else if(isAllView&&status==='pending'){
        // In "全部" view, allow skipping pending stages
        actions='<button class="btn-sm btn-gray" onclick="APP.skipStage(\''+pid+'\',\''+s.key+'\')">跳过</button>';
      }

      // R&D support button for maintenance stage when in-progress
      var rdSection='';
      if(s.key==='maintenance'&&status==='in-progress'){
        if(st&&st.rdNeeded){
          rdSection='<div class="rd-support-section">'+
            '<h4>研发支援</h4>'+
            '<div>处理人：'+(st.rdHandler||'-')+'</div>'+
            '<div>到场日期：'+(st.rdDate||'-')+'</div>'+
            (st.rdNote?'<div>问题说明：'+st.rdNote+'</div>':'')+
            '<button class="btn-sm btn-gray" style="margin-top:6px" onclick="APP._promptRDSupport(\''+pid+'\')">修改支援信息</button>'+
          '</div>';
        }else{
          rdSection='<button class="btn-sm btn-outline" style="margin-top:6px;color:#ea580c;border-color:#fdba74" onclick="APP._promptRDSupport(\''+pid+'\')">召唤研发支援</button>';
        }
      }

      var dateRow='';
      if(skipped){
        dateRow='<div style="color:var(--text3)">此阶段已跳过，无需处理</div>';
      }else{
        if(st&&st.ds)dateRow+='<div>开始：'+st.ds+'</div>';
        if(status==='done'){
          if(st&&st.de)dateRow+='<div>计划截止：'+st.de+'</div>';
          if(st&&st.dr){
            var delayDays=st.de?Math.floor((new Date(st.dr+'T00:00:00')-new Date(st.de+'T00:00:00'))/86400000):0;
            dateRow+='<div>实际完成：'+st.dr+(delayed?' <span style="color:#ea580c;font-weight:700">（延期'+delayDays+'天）</span>':'')+'</div>';
          }
        }else{
          if(st&&st.de)dateRow+='<div>截止：'+st.de+(over?' <span style="color:#dc2626;font-weight:700">（已超期'+daysAgo(st.de)+'天）</span>':'')+'</div>';
        }
        if(!dateRow&&status==='pending')dateRow='<div style="color:var(--text3)">等待 '+s.dept+' 处理</div>';
        if(!dateRow)dateRow='<div style="color:var(--text3)">-</div>';
      }

      var detailCls='stage-detail';
      if(skipped)detailCls+=' skipped';
      if(isMine)detailCls+=' current';
      if(status==='done')detailCls+=delayed?' delayed-done':' completed';
      var detailStyle=over?' style="border-color:#fecaca;background:#fff5f5"':'';
      html+='<div class="'+detailCls+'"'+detailStyle+' id="sd-'+pid+'-'+s.key+'">'+
        '<div class="sd-header">'+
          '<span class="sd-label">'+(i+1)+'. '+s.name+' <span style="font-size:11px;color:var(--text3);font-weight:400">('+s.dept+')</span></span>'+
          '<span class="sd-status" style="background:'+bg+';color:'+color+'">'+label+'</span>'+
        '</div>'+
        '<div class="sd-info" id="sdi-'+pid+'-'+s.key+'">'+dateRow+
          (st&&st.h?'<div>处理人：'+st.h+'</div>':'')+
          (st&&st.n?'<div>备注：'+st.n+'</div>':'')+
        '</div>'+
        rdSection+
        (actions?'<div class="sd-actions">'+actions+'</div>':'')+
      '</div>';
    }

    html+='<div style="display:flex;gap:8px;margin-top:16px">'+
      '<button class="btn-sm btn-primary" style="flex:1" onclick="APP.openEditModal(\''+pid+'\')">编辑基本信息</button>'+
      '<button class="btn-sm btn-danger" style="flex:1" onclick="APP.deleteProject(\''+pid+'\')">删除项目</button>'+
    '</div>';

    document.getElementById('detailContent').innerHTML=html;
    document.getElementById('detailModal').style.display='flex';
  },

  // ==== STAGE ACTIONS ====
  startMyStage:function(pid){
    var p=this.findProject(pid);if(!p)return;
    var sk=this.stageKeyFor(this.dept);
    this._promptDeadline(pid,sk);
  },

  completeMyStage:function(pid){
    var p=this.findProject(pid);if(!p)return;
    var sk=this.stageKeyFor(this.dept);
    var deadline=p.stages[sk].de||'';
    var actualDate=today();
    p.stages[sk].dr=actualDate;
    p.stages[sk].delayed=(deadline&&actualDate>deadline)?true:false;
    p.stages[sk].s='done';
    // Parallel completion check (skip also counts as done)
    if(isParallelStage(sk)){
      var allDone=PARALLEL_KEYS.every(function(k){var st=p.stages[k];return st&&(st.s==='done'||st.s==='skip')});
      if(allDone&&p.stages.shipping&&p.stages.shipping.s==='pending'){
        p.stages.shipping.s='in-progress';
        p.stages.shipping.ds=today();
        var defDe=new Date();defDe.setDate(defDe.getDate()+7);p.stages.shipping.de=defDe.toISOString().split('T')[0];
      }
    }
    // shipping 完成 → 自动启动 maintenance
    if(sk==='shipping'&&p.stages.maintenance&&p.stages.maintenance.s==='pending'){
      p.stages.maintenance.s='in-progress';
      p.stages.maintenance.ds=today();
      var mDe3=new Date();mDe3.setDate(mDe3.getDate()+7);p.stages.maintenance.de=mDe3.toISOString().split('T')[0];
    }
    // maintenance 完成 → 自动启动 payment
    if(sk==='maintenance'&&p.stages.payment&&p.stages.payment.s==='pending'){
      p.stages.payment.s='in-progress';
      p.stages.payment.ds=today();
      var pDe3=new Date();pDe3.setDate(pDe3.getDate()+7);p.stages.payment.de=pDe3.toISOString().split('T')[0];
    }
    this.saveData();this.renderAll();
    this.toast(p.stages[sk].delayed?'已标记完成（延期完成）':'已标记完成','success');
  },

  startStage:function(pid,sk){
    this._promptDeadline(pid,sk);
  },

  completeStage:function(pid,sk){
    var p=this.findProject(pid);if(!p)return;
    var deadline=p.stages[sk].de||'';
    var actualDate=today();
    p.stages[sk].dr=actualDate;
    p.stages[sk].delayed=(deadline&&actualDate>deadline)?true:false;
    p.stages[sk].s='done';
    // If this is a parallel stage, check if all parallel stages done/skip → auto-start shipping
    if(isParallelStage(sk)){
      var allDone=PARALLEL_KEYS.every(function(k){var st=p.stages[k];return st&&(st.s==='done'||st.s==='skip')});
      if(allDone){
        // Auto-start shipping if pending, inherit dates from last completed parallel stage
        if(p.stages.shipping&&p.stages.shipping.s==='pending'){
          p.stages.shipping.s='in-progress';
          p.stages.shipping.ds=today();
          var lastDate='';
          PARALLEL_KEYS.forEach(function(k){var d=p.stages[k].dr||p.stages[k].de;if(d&&d>lastDate)lastDate=d});
          var defDe=new Date();defDe.setDate(defDe.getDate()+7);var deStr=defDe.toISOString().split('T')[0];
          p.stages.shipping.de=lastDate||deStr;
        }
      }
    }
    // shipping 完成 → 自动启动 maintenance
    if(sk==='shipping'&&p.stages.maintenance&&p.stages.maintenance.s==='pending'){
      p.stages.maintenance.s='in-progress';
      p.stages.maintenance.ds=today();
      var mDe=new Date();mDe.setDate(mDe.getDate()+7);p.stages.maintenance.de=mDe.toISOString().split('T')[0];
    }
    // maintenance 完成 → 自动启动 payment
    if(sk==='maintenance'&&p.stages.payment&&p.stages.payment.s==='pending'){
      p.stages.payment.s='in-progress';
      p.stages.payment.ds=today();
      var pDe=new Date();pDe.setDate(pDe.getDate()+7);p.stages.payment.de=pDe.toISOString().split('T')[0];
    }
    this.saveData();this.renderAll();this.openDetail(pid);
    this.toast(p.stages[sk].delayed?'已标记完成（延期完成）':'已标记完成','success');
  },

  // Skip a stage (mark as not needed)
  skipStage:function(pid,sk){
    var p=this.findProject(pid);if(!p)return;
    p.stages[sk].s='skip';
    p.stages[sk].ds='';p.stages[sk].de='';p.stages[sk].h='';
    // If this is a parallel stage, check if all parallel stages done/skip → auto-start shipping
    if(isParallelStage(sk)){
      var allDone=PARALLEL_KEYS.every(function(k){var st=p.stages[k];return st&&(st.s==='done'||st.s==='skip')});
      if(allDone&&p.stages.shipping&&p.stages.shipping.s==='pending'){
        p.stages.shipping.s='in-progress';
        p.stages.shipping.ds=today();
        var lastDate='';
        PARALLEL_KEYS.forEach(function(k){var st=p.stages[k];var d=st.dr||st.de;if(d&&d>lastDate)lastDate=d});
        var defDe=new Date();defDe.setDate(defDe.getDate()+7);p.stages.shipping.de=lastDate||defDe.toISOString().split('T')[0];
      }
    }
    // shipping 跳过 → 自动启动 maintenance
    if(sk==='shipping'&&p.stages.maintenance&&p.stages.maintenance.s==='pending'){
      p.stages.maintenance.s='in-progress';
      p.stages.maintenance.ds=today();
      var mDe2=new Date();mDe2.setDate(mDe2.getDate()+7);p.stages.maintenance.de=mDe2.toISOString().split('T')[0];
    }
    // maintenance 跳过 → 自动启动 payment
    if(sk==='maintenance'&&p.stages.payment&&p.stages.payment.s==='pending'){
      p.stages.payment.s='in-progress';
      p.stages.payment.ds=today();
      var pDe2=new Date();pDe2.setDate(pDe2.getDate()+7);p.stages.payment.de=pDe2.toISOString().split('T')[0];
    }
    this.saveData();this.renderAll();this.openDetail(pid);
    this.toast('已跳过：'+STAGES.find(function(s){return s.key===sk}).name,'info');
  },

  // Restore a skipped stage back to pending
  unskipStage:function(pid,sk){
    var p=this.findProject(pid);if(!p)return;

  closeGantt:function(){document.getElementById('ganttModal').style.display='none'},
  renderGantt:function(){
    var self=this,projects=this.projects;
    // Find date range: earliest start to latest deadline across all stages
    var minDate=null,maxDate=null;
    projects.forEach(function(p){
      STAGES.forEach(function(s){
        var st=p.stages[s.key];if(!st)return;
        if(st.ds&&(!minDate||st.ds<minDate))minDate=st.ds;
        if(st.de&&(!maxDate||st.de>maxDate))maxDate=st.de;
      });
    });
    if(!minDate)minDate=today();
    if(!maxDate||maxDate<minDate){var d=new Date(minDate+'T00:00:00');d.setMonth(d.getMonth()+3);maxDate=d.toISOString().split('T')[0]}

    var totalDays=Math.max(Math.floor((new Date(maxDate+'T00:00:00')-new Date(minDate+'T00:00:00'))/86400000)+1,30);
    var ROW_H=44,HEADER_H=60,LABEL_W=140,CHART_PAD=12;
    var dayW=Math.max(totalDays>60?6:10,4); // px per day
    var chartW=CHART_PAD*2+totalDays*dayW;
    var totalH=HEADER_H+projects.length*ROW_H+20;

    // Month labels
    var months=[];
    var cur=new Date(minDate+'T00:00:00');cur.setDate(1);
    while(cur<=new Date(maxDate+'T00:00:00')){
      months.push({y:cur.getFullYear(),m:cur.getMonth(),label:(cur.getMonth()+1)+'月'});
      cur.setMonth(cur.getMonth()+1);
    }

    var svg='<svg width="'+chartW+'" height="'+totalH+'" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,sans-serif">';
    svg+='<rect width="'+chartW+'" height="'+totalH+'" fill="#fafbfc"/>';

    // Month dividers
    svg+='<line x1="'+CHART_PAD+'" y1="'+HEADER_H+'" x2="'+(chartW-CHART_PAD)+'" y2="'+HEADER_H+'" stroke="#e2e8f0"/>';
    for(var mi=0;mi<months.length;mi++){
      var monthStart=new Date(months[mi].y,months[mi].m,1);
      var daysFromStart=Math.floor((monthStart-new Date(minDate+'T00:00:00'))/86400000);
      var mx=CHART_PAD+daysFromStart*dayW;
      svg+='<text x="'+mx+'" y="28" font-size="12" font-weight="600" fill="#64748b">'+months[mi].label+'</text>';
      svg+='<line x1="'+mx+'" y1="36" x2="'+mx+'" y2="'+HEADER_H+'" stroke="#e2e8f0" stroke-dasharray="3,3"/>';
    }
    // Today line
    var todayDays=Math.floor((new Date()-new Date(minDate+'T00:00:00'))/86400000);
    var todayX=CHART_PAD+todayDays*dayW;
    if(todayDays>=0&&todayDays<=totalDays){
      svg+='<line x1="'+todayX+'" y1="'+HEADER_H+'" x2="'+todayX+'" y2="'+totalH+'" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>'+
        '<text x="'+(todayX-14)+'" y="'+(HEADER_H-4)+'" font-size="10" fill="#dc2626" font-weight="700">今天</text>';
    }

    // Row backgrounds
    for(var i=0;i<projects.length;i++){
      var ry=HEADER_H+i*ROW_H;
      svg+='<rect x="'+CHART_PAD+'" y="'+(ry+2)+'" width="'+(chartW-CHART_PAD*2)+'" height="'+(ROW_H-3)+'" fill="'+(i%2?'#f8fafc':'#fff')+'" rx="4"/>';
    }

    // Stage bars
    var statusColors={done:'#059669','in-progress':'#4f46e5',pending:'#cbd5e1',skip:'#e2e8f0'};
    projects.forEach(function(p,pi){
      var ry=HEADER_H+pi*ROW_H;
      STAGES.forEach(function(s){
        var st=p.stages[s.key];if(!st)return;
        if(st.s==='skip')return; // skip stages: no bar
        var color=statusColors[st.s]||'#cbd5e1';
        if(st.s==='in-progress'&&isOverdue(st))color='#dc2626';
        if(st.s==='done'&&isStageDelayed(st))color='#ea580c';
        // R&D support pattern for maintenance
        var patternDef='';
        if(s.key==='maintenance'&&st.rdNeeded){
          color='#ea580c';
        }
        var hasDates=st.ds&&st.de;
        if(hasDates){
          var barStart=Math.floor((new Date(st.ds+'T00:00:00')-new Date(minDate+'T00:00:00'))/86400000);
          var barEnd=Math.floor((new Date(st.de+'T00:00:00')-new Date(minDate+'T00:00:00'))/86400000)+1;
          var bx=CHART_PAD+Math.max(0,barStart)*dayW;
          var bw=Math.max(2,(barEnd-barStart)*dayW);
          var by=ry+10,bh=ROW_H-20;
          svg+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+color+'" opacity="0.85"/>';
          // Text label inside bar (if wide enough)
          if(bw>40){
            var label=s.name.replace('维护开通','维护').replace('生产','生产');
            svg+='<text x="'+(bx+bw/2)+'" y="'+(by+bh/2+4)+'" text-anchor="middle" font-size="10" fill="#fff" font-weight="500">'+label+'</text>';
          }
          // If done, add a completion marker
          if(st.s==='done'){
            svg+='<circle cx="'+(bx+bw-3)+'" cy="'+(by+bh/2)+'" r="5" fill="#fff" opacity="0.8"/>';
            svg+='<text x="'+(bx+bw-5)+'" y="'+(by+bh/2+3)+'" text-anchor="middle" font-size="7" fill="'+color+'">✓</text>';
          }
          // R&D support indicator on maintenance bar
          if(s.key==='maintenance'&&st.rdNeeded){
            svg+='<text x="'+(bx+4)+'" y="'+(by-2)+'" font-size="8" fill="#ea580c" font-weight="700">RD</text>';
          }
        }else if(st.s==='pending'){
          // Show a thin placeholder for pending stages (at expected position)
          var idx=STAGES.indexOf(s);
          if(idx>0&&STAGES[idx-1]){
            var prevSt=p.stages[STAGES[idx-1].key];
            if(prevSt&&prevSt.de){
              var pendStart=Math.floor((new Date(prevSt.de+'T00:00:00')-new Date(minDate+'T00:00:00'))/86400000)+1;
              var px=CHART_PAD+pendStart*dayW;
              var py=ry+20,ph=ROW_H-36;
              svg+='<rect x="'+px+'" y="'+py+'" width="24" height="'+ph+'" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3"/>';
            }
          }
        }
      });
    });

    svg+='</svg>';

    // Build labels HTML
    var labels='';
    projects.forEach(function(p,pi){
      labels+='<div class="gantt-label-item" onclick="APP.openDetail(\''+p.id+'\')" title="'+p.name+'">'+
        '<span style="color:var(--primary);margin-right:4px">'+(pi+1)+'.</span>'+p.name+'</div>';
    });

    // Legend
    document.getElementById('ganttLegend').innerHTML=
      '<div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:#059669"></div>已完成</div>'+
      '<div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:#ea580c"></div>延期完成</div>'+
      '<div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:#4f46e5"></div>进行中</div>'+
      '<div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:#dc2626"></div>已超期</div>'+
      '<div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:#e2e8f0;border:1px dashed #94a3b8"></div>待启动</div>'+
      '<div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 3px,#f1f5f9 3px,#f1f5f9 6px);border:1px dashed #94a3b8"></div>已跳过</div>'+
      '<div class="gantt-legend-item"><span style="font-size:9px;font-weight:700;color:#ea580c;background:#fff7ed;border:1px solid #fdba74;padding:1px 4px;border-radius:3px">RD</span>需研发支援</div>';

    document.getElementById('ganttBody').innerHTML=
      '<div class="gantt-labels"><div style="height:'+HEADER_H+'px;padding:12px 10px;font-size:11px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border)">项目名称</div>'+labels+'</div>'+
      '<div class="gantt-chart">'+svg+'</div>';
  },
  renderAnalytics:function(){
    var self=this;
    var total=this.projects.length;
    if(!total){
      document.getElementById('analyticsContent').innerHTML='<h2>数据分析</h2><div class="empty-state"><p>暂无数据，请先创建项目</p><button class="btn-sm btn-primary" onclick="APP.closeAnalytics()">关闭</button></div>';
      return;
    }

    // Compute stats
    var inProg=0,delayed=0,completed=0,pending=0,delayedDone=0,skipped=0,rdSupport=0;
    var stageStats={}; // {key: {inProg,delayed,done,pending,total,delayedDone,skip}}
    STAGES.forEach(function(s){stageStats[s.key]={inProg:0,delayed:0,done:0,pending:0,total:0,delayedDone:0,skip:0}});

    this.projects.forEach(function(p){
      var allDone=true;
      STAGES.forEach(function(s){
        var st=p.stages[s.key];
        var ss=stageStats[s.key];
        ss.total++;
        if(st&&st.s==='done'){
          ss.done++;
          if(isStageDelayed(st)){ss.delayedDone++;delayedDone++}
        }
        else if(st&&st.s==='skip'){ss.skip++;skipped++}
        else if(isOverdue(st)){ss.delayed++;delayed++}
        else if(st&&st.s==='in-progress'){ss.inProg++;inProg++}
        else{ss.pending++;pending++}
        if(!st||(st.s!=='done'&&st.s!=='skip'))allDone=false;
        // Count R&D support
        if(s.key==='maintenance'&&st&&st.rdNeeded)rdSupport++;
      });
      if(allDone)completed++;
    });

    // Overview
    var html='<h2>数据分析看板</h2>'+
      '<div class="analytics-grid">'+
        this._statCard(total,'项目总数','#4f46e5')+
        this._statCard(inProg,'进行中','#2563eb',Math.round(inProg/total*100)+'%')+
        this._statCard(delayed,'已超期','#dc2626',Math.round(delayed/total*100)+'%'+(delayed>0?' ⚠':' ✓'))+
        this._statCard(completed,'已完成','#059669',delayedDone>0?delayedDone+'个延期':'100%完成')+
      '</div>'+
      '<div class="analytics-grid" style="margin-top:8px">'+
        this._statCard(skipped,'已跳过阶段','#94a3b8',skipped>0?'省去非必要环节':'-')+
        this._statCard(rdSupport,'需研发支援','#ea580c',rdSupport>0?'维护阶段召唤研发':'-')+
      '</div>';

    // Stage distribution bar chart — grouped bars with legend
    html+='<div class="analytics-section"><h3>阶段分布</h3><div class="chart-container">';
    var maxStageTotal=Math.max.apply(null,STAGES.map(function(s){return stageStats[s.key].total}),1);
    STAGES.forEach(function(s){
      var ss=stageStats[s.key];
      var onTime=ss.done-ss.delayedDone;
      var dPct=Math.round(onTime/maxStageTotal*100);
      var ddPct=Math.round(ss.delayedDone/maxStageTotal*100);
      var iPct=Math.round(ss.inProg/maxStageTotal*100);
      var dePct=Math.round(ss.delayed/maxStageTotal*100);
      var skPct=Math.round(ss.skip/maxStageTotal*100);
      html+='<div class="bar-row"><div class="bar-label">'+s.name+'</div><div class="bar-track">'+
        (onTime?'<div class="bar-fill" style="width:'+dPct+'%;background:#059669;border-radius:4px"><span>'+onTime+'</span></div>':'')+
        (ss.delayedDone?'<div class="bar-fill" style="width:'+ddPct+'%;background:#ea580c;border-radius:4px;margin-left:2px"><span>'+ss.delayedDone+'</span></div>':'')+
        (ss.inProg?'<div class="bar-fill" style="width:'+iPct+'%;background:#2563eb;border-radius:4px;margin-left:2px"><span>'+ss.inProg+'</span></div>':'')+
        (ss.delayed?'<div class="bar-fill" style="width:'+dePct+'%;background:#dc2626;border-radius:4px;margin-left:2px"><span>'+ss.delayed+'</span></div>':'')+
        (ss.skip?'<div class="bar-fill" style="width:'+skPct+'%;background:#94a3b8;border-radius:4px;margin-left:2px"><span>'+ss.skip+'</span></div>':'')+
        (!ss.done&&!ss.inProg&&!ss.delayed&&!ss.skip?'<div style="font-size:11px;color:#94a3b8;padding:2px 8px">'+ss.pending+' 待启动</div>':'')+
      '</div></div>';
    });
    // Legend
    html+='<div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--text3);flex-wrap:wrap">'+
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#059669;margin-right:3px;vertical-align:middle"></span>已完成</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#ea580c;margin-right:3px;vertical-align:middle"></span>延期完成</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#2563eb;margin-right:3px;vertical-align:middle"></span>进行中</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#dc2626;margin-right:3px;vertical-align:middle"></span>已超期</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#94a3b8;margin-right:3px;vertical-align:middle"></span>已跳过</span>'+
    '</div>';
    html+='</div></div>';

    // Department workload + donut side by side
    html+='<div class="chart-row">';

    // Department workload
    html+='<div class="analytics-section" style="flex:1;min-width:260px"><h3>部门负荷</h3><div class="chart-container">';
    var maxDept=0;
    STAGES.forEach(function(s){maxDept=Math.max(maxDept,stageStats[s.key].inProg+stageStats[s.key].delayed)});
    STAGES.forEach(function(s){
      var ss=stageStats[s.key];
      var load=ss.inProg+ss.delayed;
      var pct=maxDept?Math.round(load/maxDept*100):0;
      html+='<div class="bar-row"><div class="bar-label">'+s.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+(ss.delayed>0?'#dc2626':'#4f46e5')+'"><span>'+load+'项'+(ss.delayed?' (超期'+ss.delayed+')':'')+'</span></div></div></div>';
    });
    html+='</div></div>';

    // Completion donut — count all done/skip stages
    var onTimeStages=0,delayedDoneStages=0,inProgStages=0,delayedStages=0,pendingStages=0,skipStages=0;
    this.projects.forEach(function(p){
      STAGES.forEach(function(s){
        var st=p.stages[s.key];
        if(st&&st.s==='done'){
          if(isStageDelayed(st))delayedDoneStages++;else onTimeStages++;
        }
        else if(st&&st.s==='skip')skipStages++;
        else if(isOverdue(st))delayedStages++;
        else if(st&&st.s==='in-progress')inProgStages++;
        else pendingStages++;
      });
    });
    var totalStages=total*7;
    var doneStages=onTimeStages+delayedDoneStages;
    var effectiveStages=totalStages-skipStages; // skip stages don't count toward completion
    var donePct=effectiveStages>0?Math.round(doneStages/effectiveStages*100):0;
    var donutR=70,donutCx=90,donutCy=90,donutStroke=16;
    var circum=2*Math.PI*(donutR-donutStroke/2);
    var dashLen=circum*donePct/100;

    html+='<div class="analytics-section" style="flex:1;min-width:260px"><h3>总体完成率</h3><div class="chart-container donut-wrap">'+
      '<svg width="180" height="180" viewBox="0 0 180 180">'+
        '<circle cx="'+donutCx+'" cy="'+donutCy+'" r="'+(donutR-donutStroke/2)+'" fill="none" stroke="#e2e8f0" stroke-width="'+donutStroke+'"/>'+
        '<circle cx="'+donutCx+'" cy="'+donutCy+'" r="'+(donutR-donutStroke/2)+'" fill="none" stroke="#059669" stroke-width="'+donutStroke+'" stroke-dasharray="'+dashLen+' '+circum+'" stroke-linecap="round" transform="rotate(-90 '+donutCx+' '+donutCy+')"/>'+
        '<text x="'+donutCx+'" y="'+donutCy+'" text-anchor="middle" font-size="32" font-weight="800" fill="#1a1a2e">'+donePct+'%</text>'+
        '<text x="'+donutCx+'" y="'+(donutCy+20)+'" text-anchor="middle" font-size="11" fill="#64748b">'+doneStages+'/'+effectiveStages+' 阶段'+(skipStages?' ('+skipStages+'跳过)':'')+'</text>'+
      '</svg>'+
      '<div class="legend">'+
        '<div class="legend-item"><div class="legend-dot" style="background:#059669"></div>按时完成 '+onTimeStages+'</div>'+
        '<div class="legend-item"><div class="legend-dot" style="background:#ea580c"></div>延期完成 '+delayedDoneStages+'</div>'+
        '<div class="legend-item"><div class="legend-dot" style="background:#2563eb"></div>进行中 '+inProgStages+'</div>'+
        '<div class="legend-item"><div class="legend-dot" style="background:#dc2626"></div>已超期 '+delayedStages+'</div>'+
        '<div class="legend-item"><div class="legend-dot" style="background:#94a3b8"></div>已跳过 '+skipStages+'</div>'+
        '<div class="legend-item"><div class="legend-dot" style="background:#e2e8f0"></div>待启动 '+pendingStages+'</div>'+
      '</div>'+
    '</div></div>';

    html+='</div>'; // chart-row

    // Export button
    html+='<div style="display:flex;gap:8px;margin-top:6px">'+
      '<button class="btn-sm btn-outline" style="color:var(--success);flex:1" onclick="APP.exportExcel()">导出 Excel 报表</button>'+
      '<button class="btn-sm btn-gray" style="flex:1" onclick="APP.closeAnalytics()">关闭</button>'+
    '</div>';

    document.getElementById('analyticsContent').innerHTML=html;
  },

  _statCard:function(value,label,color,sub){
    return '<div class="analytics-card">'+
      '<div class="ac-value" style="color:'+color+'">'+value+'</div>'+
      '<div class="ac-label">'+label+'</div>'+
      (sub?'<div class="ac-sub">'+sub+'</div>':'')+
    '</div>';
  },

  // ==== EXPORT EXCEL (CSV with BOM) ====
  exportExcel:function(){
    var BOM='\uFEFF';
    // Header
    var cols=['合同号','项目名称','代理商','项目清单','当前阶段','当前状态'];
    STAGES.forEach(function(s){
      cols.push(s.name+'-状态');
      cols.push(s.name+'-开始日期');
      cols.push(s.name+'-截止日期');
      cols.push(s.name+'-实际完成');
      cols.push(s.name+'-处理人');
      cols.push(s.name+'-备注');
      if(s.key==='maintenance'){
        cols.push('维护-需研发支援');
        cols.push('维护-研发处理人');
        cols.push('维护-研发到场日期');
        cols.push('维护-研发问题说明');
      }
    });
    var csv=[cols.map(function(c){return '"'+c.replace(/"/g,'""')+'"'}).join(',')];

    // Data rows
    this.projects.forEach(function(p){
      // Find current stage
      var curIdx=findCurrentStageIdx(p),curStatus='待启动';
      var curSt=p.stages[STAGES[curIdx].key];
      if(curSt){
        if(curSt.s==='done')curStatus='已完成';
        else if(curSt.s==='skip')curStatus='已跳过';
        else if(curSt.s==='in-progress')curStatus=isOverdue(curSt)?'已超期':'进行中';
      }
      if(isOverdue(curSt))curStatus='已超期';

      var row=[
        p.contractNo||'',
        p.name||'',
        p.agent||'',
        p.items||'',
        STAGES[curIdx].name,
        curStatus
      ];
      STAGES.forEach(function(s){
        var st=p.stages[s.key];
        var stageStatus='待启动';
        if(st&&st.s==='done'){stageStatus=isStageDelayed(st)?'延期完成':'已完成'}
        else if(st&&st.s==='skip'){stageStatus='已跳过'}
        else if(st&&st.s==='in-progress'){stageStatus=isOverdue(st)?'已超期':'进行中'}
        row.push(stageStatus);
        row.push(st&&st.ds?st.ds:'');
        row.push(st&&st.de?st.de:'');
        row.push(st&&st.dr?st.dr:'');
        row.push(st&&st.h?st.h:'');
        row.push(st&&st.n?st.n:'');
        if(s.key==='maintenance'){
          row.push(st&&st.rdNeeded?'是':'');
          row.push(st&&st.rdHandler?st.rdHandler:'');
          row.push(st&&st.rdDate?st.rdDate:'');
          row.push(st&&st.rdNote?st.rdNote:'');
        }
      });
      csv.push(row.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(','));
    });

    var blob=new Blob([BOM+csv.join('\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='感创项目报表_'+today()+'.csv';a.click();
    this.toast('Excel 报表已导出，'+this.projects.length+'个项目','success');
  },

  // ==== HELPERS ====
  findProject:function(pid){
    for(var i=0;i<this.projects.length;i++){if(this.projects[i].id===pid)return this.projects[i]}
    return null;
  },
  toast:function(msg,type){
    var existing=document.querySelector('.toast');if(existing)existing.remove();
    var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(function(){t.remove()},2500);
  }
};

// ==== INIT ====
if(document.readyState!=='loading')APP.init();
else document.addEventListener('DOMContentLoaded',function(){APP.init()});
</script>
